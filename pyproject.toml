[project]
name = "harness"
version = "0.0.1"
description = "Persistent-character model-agent harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    # date_math relies on dateutil for natural-language + iso parsing
    # plus relativedelta arithmetic (harness-6mh8). Was previously
    # available transitively; pinned directly now that harness code
    # imports it.
    "python-dateutil>=2.9",
    # date_math.business_days op (harness-kncj) — US federal holiday
    # table plus weekend-rolling business-day arithmetic. Pure-Python,
    # ~1.4 MB install, no compiled deps. PyPI name is `holidays`.
    "holidays>=0.50",
    # sun tool (harness-jqep) — sunrise/sunset/civil-twilight/solar-noon
    # at a given lat/lon/date. astral is pure-Python, ~50 KB, no
    # compiled deps. Companion to now/date_math in the reckon profile.
    "astral>=3.0",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.22",
    "mlx-lm>=0.20",
]
retrieval = [
    "sentence-transformers>=3.0",
    "numpy>=2.0",
]
grammar = [
    # Constrained JSON-schema decoding for the GrammarRouter. Lives
    # behind the adapter boundary (only src/harness/model/mlx.py
    # imports it). Pinned below 1.0 because outlines did a major API
    # rewrite in v1 (generate.json + MLXLM wrapper moved); see
    # harness-22f. Migrate to 1.x when we're ready to touch the
    # adapter's complete_grammar method.
    "outlines>=0.1,<1.0",
    # outlines 0.2.x uses TransformerTokenizer.__hash__ as the cache
    # key for its FSM lru_cache, and that __hash__ imports
    # `datasets.fingerprint.Hasher`. HF's `datasets` is no longer a
    # transitive dep of outlines 0.2.3, so every grammar classify()
    # would ModuleNotFoundError without this pin (see harness-eeo).
    "datasets>=2.20",
]
tui = [
    # Textual drives the --tui chat app (persistent input + scrolling
    # output + live metrics footer). Rich is already a hard dep;
    # Textual is optional so a non-TUI install (headless, CI) stays
    # small. See harness-56b.
    "textual>=0.86",
]
atc = [
    # atc (airton_c) corpus-extraction pipeline only (harness-xbk.4 /
    # harness-xbk.5). pymupdf4llm produces structured markdown from
    # FAA PDFs — preserves headings, lists, tables, which the section-
    # aware chunker needs to keep section anchors intact. Heavy (pulls
    # PyMuPDF ~30 MB), so gated behind its own extra rather than added
    # to the default runtime.
    "pymupdf4llm>=0.0.17",
]
asr = [
    # mlx-whisper drives the ATC audio transcribe pipeline (harness-xko1).
    # Local STT on Apple Silicon — keeps the corpus on-box per the
    # local-first invariant. Pulls numba + tiktoken transitively (~50 MB),
    # so gated behind its own extra rather than added to default runtime.
    # Default model id is `mlx-community/whisper-large-v3-mlx`; override
    # with --model on the script CLI.
    "mlx-whisper>=0.4",
]
notam = [
    # NOTAM/TFR text parser (harness-3jz1.3). pyproj provides WGS84
    # great-circle math for ParsedNOTAM.to_polygon — renders the cylinder
    # geometry as an N-point polygon for downstream SPA mapping. Pulled
    # behind its own extra (compiled C dep) so a base install stays lean
    # and the parser module itself stays import-clean (pyproj is imported
    # lazily inside to_polygon, not at module top).
    "pyproj>=3.6",
]
web = [
    # Generalizable harness.web factory (harness-3jz1.9). Turns any
    # character into a FastAPI app served via `harness web --character
    # <name>`. Stays optional so a base install / CI / headless deploy
    # doesn't pull a web server stack.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # IP-keyed rate limiting middleware. The tailnet-only ingress
    # already shrinks the threat surface, but slowapi makes the
    # generous default explicit + tunable per character extension.
    "slowapi>=0.1.9",
    # httpx is hard-required by FastAPI's TestClient + lets character
    # extensions proxy upstream FAA endpoints (e.g. /tfr_list under
    # harness-3jz1.4) without adding their own dep.
    "httpx>=0.27",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.9",
    "pre-commit>=4.0",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
    "PT",   # flake8-pytest-style
    "S",    # bandit (security)
    "N",    # pep8-naming
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # asserts are fine; pytest uses them and we prefer them
]

[tool.ruff.lint.per-file-ignores]
"src/harness/cli.py" = ["RUF001"]  # prompt glyphs are intentional
"src/harness/cli_classic.py" = ["RUF001", "RUF002"]  # same prompt glyphs as cli.py
"src/harness/cli_repl.py" = ["RUF001", "RUF002"]  # same prompt glyphs as cli.py
"src/harness/tui/*.py" = ["RUF001", "RUF002", "RUF003"]  # same `›` / `—` glyphs as the classic CLI
"scripts/atc_chunk.py" = ["RUF001", "RUF002", "RUF003"]  # U+2212 in regex + docstring is intentional (FAA corpus anchors)
"src/harness/persona/rewriter.py" = ["RUF001", "RUF002", "RUF003"]  # U+2212 in citation regexes is intentional — corpus uses it
"src/harness/persona/banter.py" = ["RUF001"]  # en-dash (U+2013) in §-citation regex is intentional
"src/harness/notam/parser.py" = ["RUF001"]  # U+2013 in NOTAM time-window regex is intentional (FAA publish pipelines auto-substitute)
"tests/test_persona.py" = ["RUF001"]  # U+2212 in citation-fold test
"tests/test_banter.py" = ["S311"]  # random.Random for deterministic non-crypto pick tests
"tests/**" = ["PLR2004"]           # magic numbers are fine in tests
"tests/test_cli_daemon.py" = ["S603"]  # subprocess calls run our own harness binary; not untrusted input
"tests/test_tui_*.py" = ["PLR2004", "RUF001", "RUF002", "RUF003"]  # same rationale as src/harness/tui/
"tests/test_atc_chunk.py" = ["RUF001", "RUF002", "RUF003"]  # U+2212 is the point — exercising the normaliser
"tests/test_eval_atc_audio.py" = ["RUF002"]  # U+2212 in section-normalization test docstring

[tool.ruff.lint.flake8-bugbear]
# typer builds arg defaults via Option/Argument calls — that's the whole API.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/harness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["outlines", "outlines.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["textual", "textual.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymupdf4llm", "pymupdf4llm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mlx_whisper", "mlx_whisper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyproj", "pyproj.*"]
ignore_missing_imports = true
