version: 1
name: tabular_returns
shape: tabular
description: |
  Synthetic returns dataset — 200 rows of (order_id, customer_id,
  category, item, amount_usd, order_month, reason, status). Records
  generated by /tmp/gen_returns.py with seed=20260514; committed at
  retrieval_eval/data/returns.csv so the bench is deterministic.

  Phase 0 baseline: each row is ingested as an episodic record with
  body = flattened text ("Order 10063: leather jacket return for $182.12
  in Mar, customer C9148, reason: damaged on arrival, status: denied").
  external_id = "order:<order_id>".

  Phase 0 expectation: the hybrid retriever lands the easy exact-string
  queries (item + reason combos that uniquely identify a row) but
  struggles on shape-dependent queries (aggregations like "highest
  value", "above $700"). The misses motivate Phase 2 — table-shaped
  storage where the model emits a SQL lookup against schema instead of
  fishing through a vector index.

  Case design:
    - q_easy_*: unique (item, reason) tuple that maps to exactly one row.
      Hybrid should win these.
    - q_hard_aggregate_*: requires sorting / filtering by amount or
      month — no flat retriever can do this correctly. These are
      hard misses we expect to see, not bugs.

data_path: ../data/returns.csv

# Schema describes how to build the embed text from a row. The bench
# script reads `data_path` as CSV, builds external_id from id_column,
# and embeds each row's record_text_template (Jinja-style {field}
# substitution) as an episodic body.
ingest:
  id_column: order_id
  id_prefix: "order:"
  record_title_template: "Order {order_id}: {category} return"
  record_body_template: |
    Return request for order {order_id}.
    Customer: {customer_id}
    Item: {item} ({category})
    Amount: ${amount_usd}
    Order month: {order_month}
    Reason: {reason}
    Status: {status}

cases:
  # ----- Easy: unique (item, reason) tuple -----
  - id: q_easy_damaged_leather_jacket
    query: "find the leather jacket return where the buyer said it arrived damaged"
    expected_record_ids: ["order:10063"]

  - id: q_easy_wrongsize_kettle_denied
    query: "kettle that was returned for being the wrong size and ended up denied"
    expected_record_ids: ["order:10708"]

  - id: q_easy_damaged_keyboard
    query: "mechanical keyboard that came in damaged"
    expected_record_ids: ["order:10511"]

  - id: q_easy_duplicate_water_filter
    query: "the customer who ordered a water filter twice by mistake"
    expected_record_ids: ["order:10346"]

  - id: q_easy_loafers_misdescribed
    query: "loafers returned because they didn't match the product description"
    expected_record_ids: ["order:10518"]

  - id: q_easy_damaged_camp_stove
    query: "camp stove that arrived damaged"
    expected_record_ids: ["order:10670"]

  # ----- Hard: shape-dependent (aggregation / sort) -----
  - id: q_hard_highest_value
    query: "show me the highest-value return in the dataset"
    expected_record_ids: ["order:10377"]   # $848.42 monitor

  - id: q_hard_second_highest
    query: "the second-highest dollar amount return"
    expected_record_ids: ["order:10331"]   # $840.18 blender

  - id: q_hard_top_march_700
    query: "March returns above seven hundred dollars"
    expected_record_ids: ["order:10476", "order:10483", "order:10628", "order:10693"]

  - id: q_hard_big_backpack_denied
    query: "expensive backpack return that the company denied"
    expected_record_ids: ["order:10476", "order:10584"]

  - id: q_hard_cheap_espresso
    query: "the cheapest espresso machine return — under thirty dollars"
    expected_record_ids: ["order:10390"]   # $22.49 denied espresso

  - id: q_hard_oct_damaged
    query: "expensive items damaged on arrival in October"
    expected_record_ids: ["order:10073", "order:10584"]
