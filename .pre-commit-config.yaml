# Local hooks so pinned deps in pyproject.toml stay the source of truth.
# Pre-push hook runs the full pytest suite so push-time trouble is caught
# before it leaves the machine.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (pre-push)
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      # Retrieval gate (harness-zxqs): blocks pushes that touch any of
      # the chunker / store / hybrid-search / search_memory tool /
      # synonym-table paths from regressing recall@k. `files:` is the
      # whole load-bearing piece — pre-commit only runs the hook when
      # at least one matching path appears in the pushed diff, so
      # unrelated work (orchestrator, persona, TUI, model adapters)
      # doesn't pay the embedder warm-up cost. Bypass: re-snapshot
      # with `harness eval atc-retrieval --save-baseline` once the
      # new state is intentional, then re-push.
      - id: atc-retrieval-gate
        name: atc retrieval gate (--compare-baseline)
        entry: scripts/retrieval_gate.sh
        language: system
        files: ^(src/harness/retrieval/|src/harness/store/(_hybrid|episodic)\.py|src/harness/tools/search_memory\.py|scripts/atc_(chunk|ingest|extract)\.py|character/airton_c1/corpus/(synonyms|query_synonyms)\.yaml)
        pass_filenames: false
        stages: [pre-push]

      # Phraseology lint gate (harness-15dy): blocks pushes that touch
      # the lint tool, the eval scorer, or the fixture from regressing
      # verdict / citation accuracy. Corpus paths are already gated by
      # atc-retrieval above. Bypass: re-snapshot with `harness eval
      # phraseology --save-baseline` once the new state is intentional,
      # then re-push.
      - id: phraseology-lint-gate
        name: phraseology lint gate (--compare-baseline)
        entry: scripts/phraseology_gate.sh
        language: system
        files: ^(src/harness/tools/phraseology_lint\.py|src/harness/evals/phraseology\.py|character/airton_c1/phraseology_eval\.yaml)
        pass_filenames: false
        stages: [pre-push]

      # Voice ablation manifest gate (harness-wrzz, plan #8). Runs on
      # any push that touches voice/canonical.yaml or voice/ablation.
      # yaml — fast structural check that ablation entries still
      # align with canonical (IDs match, gold + prompt strings haven't
      # drifted). Pure-function, no MLX/embedder load. Slow
      # measurement work (stock vs ablate vs round-robin) lives in
      # scripts/ablation_check.py and is run manually before
      # committing canonical changes — too slow for an auto-gate.
      - id: voice-ablation-gate
        name: voice ablation manifest gate
        entry: uv run python scripts/check_ablation_manifest.py
        language: system
        files: ^character/.+/voice/(canonical|ablation)\.yaml$
        pass_filenames: false
        stages: [pre-push]
