    FLIGHT OPERATIONS ARE PROHIBITED WITHIN AN AREA DEFINED AS 3 NMR OF
    324504N/0970454W SFC TO 3000FT AGL. EFFECTIVE 2605142305-2605150330 UTC.
  expected_verdict: >
    Stadium TFR — no transit within the 3 NM cylinder from surface to
    3,000 ft AGL while the restriction is active.
  expected_type: stadium
  expected_citations: ["§91.145"]
  expected_geometry:
    center: {lat: 32.7511, lon: -97.0817}
    radius_nm: 3.0
    floor: {value: 0, reference: SFC}
    ceiling: {value: 3000, reference: AGL}
  expected_active: {from: "2026-05-14T23:05:00+00:00", to: "2026-05-15T03:30:00+00:00"}

