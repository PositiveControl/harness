# tfr_eval.yaml — golden TFR/NOTAM cases for airton_c_tfr (harness-3jz1.2).
#
# 23 cases spanning the six TFR categories under 14 CFR §91.137–145 plus
# three edge cases. NOTAM texts are realistic-shape (FAA phrasing,
# DDMMSS coords, NMR radius, YYMMDDHHMM windows) but synthesized — they
# do not reference actual current TFRs.
#
# Fields per case:
#   id                : kebab-case identifier
#   raw_notam         : the published NOTAM text (multi-line scalar)
#   expected_verdict  : one-sentence plain-English explanation (judge-axis target)
#   expected_type     : one of stadium/vip/disaster/space/security/hazard/other
#   expected_citations: list of §-anchors expected to appear in parser output
#   expected_geometry : center{lat,lon}, radius_nm, floor{value,reference}, ceiling{value,reference}
#   expected_active   : {from, to} (ISO-8601 UTC)
#   caveats           : optional list of plain-English caveats
#
# Geometry tolerances applied by scorer:
#   - lat/lon : ±0.005°  (≈500 m)
#   - radius  : ±0.1 NM
#   - altitude: exact (value + reference frame)
#
# Citation accuracy uses set-equality (order-independent).

