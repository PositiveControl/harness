    # pilot?" — doc-text says "Operations in Class B airspace." Lay
    # phrasing uses "enter" / "fly into" / "VFR pilot in Class B"
    # which the section title doesn't enumerate.
    - what do I need to enter Class B airspace
    - requirements to enter Class B as VFR pilot
    - fly into Class B airspace VFR
    - VFR clearance into Class B
    - permission to enter Class B airspace

