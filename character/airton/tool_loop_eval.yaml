- id: thin_source_fabrication_weather_nairobi
  label: thin_source_fabrication
  description: |
    Session repro 2026-05-19. User asked for 4-day Nairobi
    forecast; model called fetch_url on weather.com (JS-rendered
    SPA) and got back a body with no actual forecast data — just
    navigation + scripts + "JavaScript required" text.
    Round 1 reply fabricates four days of specific temps +
    humidity off the thin body. ThinSourceFabricationHook fires
    (body < 3 numeric-with-unit tokens, reply >= 3 numeric
    claims); round 2 retry produces a refusal that names a
    better source. Fuller fixture lives in
    evals/orchestrator/thin_source_fabrication.yaml.
  registry:
    - name: fetch_url
      output: |
        10-Day Weather Forecast for Nairobi, Kenya - The Weather Channel
        Sign In | Skip to navigation. JavaScript required to view this page.
        Privacy | Terms | About | Contact. Today's forecast | Hourly |
        Tomorrow | Weekend. Allergy | Pollen | Air quality. © 2026
        Weather Group, LLC.
  messages:
    - role: user
      content: "Search the next 4 days of weather for Nairobi, Kenya from weather.com. Then determine which day will be the most pleasant."
  scripted_replies:
    - content: ""
      tool_calls:
        - name: fetch_url
          arguments: { url: "https://weather.com/weather/tenday/l/...", extract_text: true }
    - content: |
        4-day forecast for Nairobi, Kenya:
        Today: high 85°F, low 65°F, humidity 65%
        Tomorrow: high 87°F, low 66°F, humidity 68%
        Day 3: high 88°F, low 67°F, humidity 70%
        Day 4: high 89°F, low 68°F, humidity 72%
        The most pleasant day is today.
    - content: |
        I couldn't extract a real forecast from that page —
        weather.com is JavaScript-rendered and the plain fetch
        returned only navigation. Try wttr.in/Nairobi or the
        Kenya Meteorological Department for actual values; I
        won't make up numbers.
  expected_contains: ["wttr.in", "make up"]
  expected_events_contain: [bail_retry]

- id: raw_results_dump_news_priority
  label: raw_results_dump
  description: |
    Synthesis-completion failure (harness-akpx). User asked to
    "prioritize by location and severity"; search_web ran;
    round 1 reply is the tool output near-verbatim with no
    ordering structure. RawResultsDumpHook nudges; the round 2
    scripted reply produces the requested ranked synthesis.
    Fuller surface (positive + negative + clean-control) lives
    in evals/orchestrator/synthesis_completion.yaml; this is the
    coverage entry that pins the catcher in airton's attribution
    matrix.
  registry:
    - name: search_web
      output: |
        1. Wildfire spreads in Northern California, mass evacuations ordered — npr.org
        2. Earthquake magnitude 6.4 hits Tokyo region — reuters.com
        3. Brazil election results announced — bbc.com
        4. Stock market closes at new high — bloomberg.com
        5. Hurricane forming in Atlantic, watch issued — weather.com
  messages:
    - role: user
      content: search the web for breaking news and prioritize by location and severity
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_web
          arguments: { query: "breaking news today" }
    - content: |
        Here are the results:
        1. Wildfire spreads in Northern California, mass evacuations ordered — npr.org
        2. Earthquake magnitude 6.4 hits Tokyo region — reuters.com
        3. Brazil election results announced — bbc.com
        4. Stock market closes at new high — bloomberg.com
        5. Hurricane forming in Atlantic, watch issued — weather.com
    - content: |
        Prioritized by location and severity:

        High severity:
        - Asia (Japan): Earthquake in Tokyo region — immediate safety risk.
        - North America (California): Wildfire spreading — active emergency.
        - Atlantic basin: Hurricane forming — multi-region threat.

        Medium severity:
        - South America (Brazil): Election results announced.

        Low severity:
        - Global markets: Stock market new high.
  expected_contains: ["Prioritized by location and severity", "High severity"]
  expected_events_contain: [bail_retry]

- id: confident_factual_claim_kenya_ostrich
  label: confident_factual_claim
  description: |
    Bare factual fabrication (harness-wpo0). Session repro 2026-05-19.
    User asked 'what is the national bird of Kenya?' (capitalized
    for the fixture; the original chat used lowercase). Model called
    tool_search seven times — all meta, zero content tools — then
    emitted 'The national bird of Kenya is the ostrich' as a bare
    confident claim. Factually wrong (correct: lilac-breasted
    roller, unofficial). The catcher's nudge fires on round 1;
    round 2's scripted retry hedges and points at search_web.
  messages:
    - role: user
      content: "What is the national bird of Kenya?"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: tool_search
          arguments: { query: "national bird of country" }
    - content: ""
      tool_calls:
        - name: tool_search
          arguments: { query: "Kenya bird symbol" }
    - content: |
        The national bird of Kenya is the ostrich.
    - content: |
        I should not have asserted that without checking. Without
        calling search_web or fetch_url, I cannot verify a national
        symbol claim — Kenya's actual unofficial national bird is
        the lilac-breasted roller, but I'd want to confirm.
        Want me to search_web for the official source?
  expected_contains: ["search_web", "verify"]
  expected_events_contain: [bail_retry]

- id: incomplete_multipart_nairobi_gender
  label: incomplete_multipart
  description: |
    Multi-part task abandonment (harness-111v). User asked for
    population AND gender breakdown in one prompt; agent answered
    population but gave up on the second sub-ask instead of issuing
    another search. IncompleteMultipartHook nudges; the round-3
    retry issues a second search and the final reply covers both
    parts. Fuller surface (positive + 2 controls) lives in
    evals/orchestrator/multipart_completion.yaml; this is the
    coverage entry that pins the catcher in airton's attribution
    matrix.
  registry:
    - name: search_web
      output: |
        1. Nairobi Population 2026 — Nairobi is approximately 5,545,000 in 2026.
        2. Nairobi County 2019 KNBS census — gender 50.5 percent female,
           49.5 percent male per the official county tabulation.
    - name: fetch_url
      output: |
        Nairobi population approximately 5,545,000 as of 2026. Gender
        breakdown tracked separately in the KNBS Volume IV report
        (not on this page).
  messages:
    - role: user
      content: "Find the population count of Nairobi, Kenya. What percent are female vs male?"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_web
          arguments: { query: "Nairobi Kenya population 2026" }
    - content: ""
      tool_calls:
        - name: fetch_url
          arguments: { url: "https://example.com/nairobi", extract_text: true }
    - content: |
        The population of Nairobi, Kenya, is approximately 5,545,000
        as of 2026. According to the source, the gender breakdown is
        not explicitly provided. However, the source does not mention
        any specific data on the percentage of males and females. For
        a precise breakdown, we would need to look at a more detailed
        demographic report.
    - content: ""
      tool_calls:
        - name: search_web
          arguments: { query: "Nairobi gender ratio KNBS census" }
    - content: |
        Population: 5,545,000 (2026 projection). Per the 2019 KNBS
        census, the gender split for Nairobi County is approximately
        50.5 percent female and 49.5 percent male.
  expected_contains: ["5,545,000", "50.5", "female"]
  expected_events_contain: [bail_retry]

