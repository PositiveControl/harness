# Tool-loop failure corpus fixture (harness-cfm7).
#
# Replayed by `harness eval tool-loop`. Each entry scripts a sequence
# of model replies and scores the final ToolLoopResult against
# contains / not_contains assertions. `label` names the orchestrator
# catcher the scenario stresses — the attribution harness disables one
# catcher at a time and reports which scenarios it uniquely saves.
#
# Scenario schema:
#   id                        unique slug
#   label                     catcher name (see CATCHER_NAMES) or 'control'
#   description               one-line rationale
#   messages                  initial thread (default: one user 'hi' turn)
#   scripted_replies          list of ModelReply shapes the scripted
#                             adapter dequeues in order
#     content                 assistant text (may be empty)
#     tool_calls              list of {name, arguments}
#     was_truncated           bool
#     had_unparseable_call    bool
#   registry                  list of mock tools: {name, output, success, tier}
#   max_rounds                default 8
#   expected_contains         substrings that MUST appear in final content
#   expected_not_contains     substrings that MUST NOT appear
#   expected_fallback         bool — true if the fabrication-exhaustion
#                             fallback is expected to fire
#   expected_events_contain   ToolLoopEvent kinds that must appear
#   expected_events_not_contain  kinds that must NOT appear
#   expected_messages_contain    substrings that must appear somewhere
#                                across result.messages (assistant +
#                                tool-role content)
#   expected_messages_not_contain opposite of above

# ---------- bail catchers (text-shape → nudge → retry → fallback) ----------

- id: teaser_trailing
  label: teaser
  description: Trailing 'Let me check…' with no tool_call runs out retries and
    falls back to the canned refusal.
  scripted_replies:
    - content: "Sure. Let me check the file:"
    - content: "Okay. I'll now look at the path:"
    - content: "Let me open it:"
  expected_fallback: true
  expected_events_contain: [bail_retry]
  expected_not_contains: ["Let me check the file"]

- id: false_success_no_tool
  label: false_success
  description: Model claims 'has been added' without calling any write tool.
  scripted_replies:
    - content: "Got it — the entry has been added to the config."
    - content: "Great, the value is now included."
    - content: "The item has been updated successfully."
  expected_fallback: true
  expected_events_contain: [bail_retry]

- id: meta_confirm_prompt
  label: meta_confirm
  description: Model asks 'Would you like me to proceed?' instead of acting.
  scripted_replies:
    - content: "Would you like me to proceed with that change?"
    - content: "Shall I go ahead and add it?"
    - content: "Please confirm your approval before I continue."
  expected_fallback: true
  expected_events_contain: [bail_retry]

- id: fabricated_search_results
  label: fabricated_search
  description: Model invents a numbered list of search hits with placeholder
    URLs instead of calling search_web.
  scripted_replies:
    - content: |
        Here are the results:
        1. Example BBQ — https://example.com/bbq
        2. Another — https://test.org/places
    - content: |
        Here are the results I found:
        1. Best BBQ spots — https://your-site.com/food
    - content: |
        Top results:
        1. BBQ Phoenix — https://placeholder.net/bbq
  expected_fallback: true
  expected_events_contain: [bail_retry]

- id: ab_fabrication_capture_colon
  label: ab_fabrication
  description: "Fake ab_ops capture receipt using colon form `Captured: …` (harness-lbh)."
  scripted_replies:
    - content: "Captured: a new thought about the plan."
    - content: "Captured: another item."
    - content: "Captured: still pretending."
  expected_fallback: true

- id: ab_fabrication_remembered
  label: ab_fabrication
  description: "Fake RememberTool receipt `Remembered: …` (harness-z734)."
  scripted_replies:
    - content: "Remembered: dad Steve's birthday is Oct 8th"
    - content: "Remembered: another fact"
    - content: "Remembered: one more"
  expected_fallback: true

- id: ab_fabrication_bead_id
  label: ab_fabrication
  description: "Imaginary bead-id schema `Bead id: harness-xxx` (harness-ce2x)."
  scripted_replies:
    - content: "Done. Bead id: harness-abc123"
    - content: "Created. Bead id: harness-def456"
    - content: "Saved. Bead id: harness-ghi789"
  expected_fallback: true

- id: ab_fabrication_short_scope
  label: ab_fabrication
  description: Abbreviated scope brackets `[prof/…]` — real scopes never abbrev.
  scripted_replies:
    - content: "Captured the item [prof/work] for later."
    - content: "Tagged [pers/home] as personal."
    - content: "Moved [prof/ops] to watching."
  expected_fallback: true

- id: ab_fabrication_date_header
  label: ab_fabrication
  description: Plan-imitation date header `Today — 2026-04-18` (harness-jj9).
  scripted_replies:
    - content: "Today — 2026-04-18: here is your plan."
    - content: "Today — 2026-04-18 rundown coming up."
    - content: "Today — 2026-04-18 — listing now."
  expected_fallback: true

- id: ab_fabrication_tier_headers
  label: ab_fabrication
  description: Two+ tier labels (Shall/Should) in one reply — plan imitation.
  scripted_replies:
    - content: "Shall: finish the thing. Should: draft the doc."
    - content: "Shall: ship. Should: test. Shmaybe: refactor."
    - content: "Shall- one thing. Should- another."
  expected_fallback: true

- id: ab_fabrication_bare_claim
  label: ab_fabrication
  description: Bare past-tense success token `Updated.` with no tool call
    (harness-ce2x).
  scripted_replies:
    - content: "Updated."
    - content: "Captured."
    - content: "Remembered."
  expected_fallback: true

- id: tool_intent_no_call
  label: tool_intent
  description: Model says 'I will search…' but emits no tool_call.
  scripted_replies:
    - content: "I will search for the latest pricing now."
    - content: "Let me look up the answer."
    - content: "I'll check the file for you."
  expected_fallback: true

# ---------- mechanism catchers ----------

- id: truncated_auto_widen
  label: truncated
  description: First reply was_truncated=True — orchestrator doubles token cap
    and retries; second reply lands a clean final answer.
  scripted_replies:
    - content: "partial reply that got cut off"
      was_truncated: true
    - content: "full final answer"
  expected_contains: ["full final answer"]
  expected_not_contains: ["partial reply"]
  expected_events_contain: [truncated_retry]

- id: unparseable_tool_call
  label: unparseable
  description: First reply had_unparseable_call=True — orchestrator asks the
    model to re-emit the JSON; second reply is a clean answer.
  scripted_replies:
    - content: "tried to call a tool but the JSON was malformed"
      had_unparseable_call: true
    - content: "here is the answer"
  expected_contains: ["here is the answer"]
  expected_messages_contain: ["<tool_call>…</tool_call>"]
  expected_events_contain: [bail_retry]

- id: fabricated_itemization_regen
  label: fabricated_itemization
  description: Follow-up fabrication (harness-f5x). User asks for more
    detail on item N from an earlier fetch; model regenerates a fake
    "here are the first N articles" summary list without calling
    fetch_url. The itemization catcher fires on the regen shape; every
    retry keeps regenerating so the fabrication-exhaustion fallback
    takes over.
  messages:
    - role: user
      content: "Yes, get more details on 8"
  scripted_replies:
    - content: "Sure — here are the first 5 articles from the BBC News website:\n1. Iran blockade...\n2. US-Iran standoff..."
    - content: "Let's focus on one of the top stories. Here are the first 5 headlines:"
    - content: "Here's a rundown of the headlines:"
  expected_fallback: true
  expected_events_contain: [bail_retry]
  expected_not_contains: ["here are the first"]

- id: argument_grounding_leaked_domain
  label: argument_grounding
  description: Router or main model emits a tool call whose `query` names a
    domain (`dailydrop.fm`) that the user never mentioned — classic
    retrieved-memory leak when the user actually asked about
    stackoverflow. Grounding hook skips the call with a re-plan nudge;
    the recovery round gives a plain answer (harness-7od).
  messages:
    - role: user
      content: go to stackoverflow and summarize the first question there
  registry:
    - name: search_web
      output: "search-result"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_web
          arguments: {"query": "dailydrop.fm", "max_results": 1}
    - content: "I couldn't figure out the right search for that — can you paste the stackoverflow URL?"
  expected_contains: ["stackoverflow"]
  expected_messages_contain:
    - "grounded-args check failed"
    - "dailydrop"
  expected_events_contain: [tool_call_deduped]
  expected_messages_not_contain: ["search-result"]

- id: duplicate_call_short_circuit
  label: duplicate_call
  description: Model re-emits the same (name, args) tool call — orchestrator
    dedups and feeds back the 'stop re-calling' nudge.
  registry:
    - name: echo
      output: "echo-output"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: echo
          arguments: {}
    - content: ""
      tool_calls:
        - name: echo
          arguments: {}
    - content: "done"
  expected_contains: ["done"]
  expected_events_contain: [tool_call_deduped]
  expected_messages_contain: ["duplicate call"]

- id: paired_meta_confirm_strip
  label: paired_meta_confirm_strip
  description: Tool call AND meta-confirm prose in the same assistant reply —
    orchestrator strips the content so the wrap-up round doesn't see
    hallucinated confirmation dialog in history.
  registry:
    - name: echo
      output: "echo-output"
  scripted_replies:
    - content: "Would you like me to proceed with the change?"
      tool_calls:
        - name: echo
          arguments: {}
    - content: "done"
  expected_contains: ["done"]
  expected_messages_not_contain: ["Would you like me to proceed"]

- id: fabrication_fallback_exhaustion
  label: fabrication_fallback
  description: Every retry still trips a fabrication catcher — fallback swaps
    in the canned refusal rather than surfacing the hallucination
    (harness-24xj).
  scripted_replies:
    - content: "I will search the web now."
    - content: "Let me search the web."
    - content: "I'll search the web."
  expected_fallback: true
  expected_not_contains: ["search the web"]

- id: numeric_fabrication_cross_row_prose
  label: numeric_fabrication
  description: After a successful search_memory call that returned a pipe
    table, the model writes a prose claim that swaps a neighbor row's
    value onto the asked-about label ('MH class is 50 miles' vs. the
    retrieved `|MH|Under 50|25|`). No pipe table in the reply, so
    table_fabrication doesn't fire; numeric_fabrication catches it via
    header+label structural lookup (harness-5uq).
  registry:
    - name: search_memory
      output: "[0.033] ALTITUDE AND DISTANCE LIMITATIONS\n  lesson: JO_7110.65 §4-1-1\n  |Class|Power (watts)|Distance (miles)|\n|---|---|---|\n|CL|Under 25|15|\n|MH|Under 50|25|\n|H|50 - 1,999|50|\n|HH|2,000 or more|75|\n"
  messages:
    - role: user
      content: "What is the usable distance for an MH class RBN?"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: {"query": "MH class RBN usable distance"}
    - content: "The usable distance for an MH class RBN is 50 miles, per JO 7110.65 §4-1-1."
  expected_contains: ["fabricated row"]
  expected_not_contains: ["50 miles"]

- id: table_fabrication_grounded_bad_row
  label: table_fabrication
  description: Citation-scoped character cites a real section after a
    successful search_memory call, but reconstructs a table row the
    tool output didn't contain. The grounding tool disarms
    ungrounded_citation (citation IS grounded); table_fabrication
    catches the fabricated row via verbatim-compare against the tool
    output. Prose uses generic wording ('the values for the MH band')
    so numeric_fabrication's labeled-claim regex doesn't also fire —
    attribution eval needs ONLY table_fabrication to save this case
    (harness-5uq).
  registry:
    - name: search_memory
      output: "[0.033] ALTITUDE AND DISTANCE LIMITATIONS\n  lesson: JO_7110.65 §4-1-1\n  |Type|Power (watts)|Distance (miles)|\n|---|---|---|\n|CL|Under 25|15|\n|MH|Under 50|25|\n|H|50 - 1,999|50|\n|HH|2,000 or more|75|\n"
  messages:
    - role: user
      content: "Show me TBL 4-1-2."
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: {"query": "TBL 4-1-2 L/MF Radio Beacon"}
    - content: "Here is TBL 4-1-2 from JO 7110.65 §4-1-1:\n\n| Type | Power (watts) | Distance (miles) |\n|---|---|---|\n| MH | Under 50 | 50 |\n| H | 50 - 1,999 | 50 |\n"
  expected_contains: ["fabricated row"]
  expected_not_contains: ["| MH | Under 50 | 50 |"]

- id: ungrounded_citation_no_grounding
  label: ungrounded_citation
  description: Out-of-scope question for a citation-scoped character
    produces a fabricated §-citation reply with no memory block attached
    and no search_memory / fact_search call. Finalize hook swaps in a
    character-agnostic refusal so the user doesn't see the real-looking
    but fabricated section number (harness-oc8).
  messages:
    - role: user
      content: "what are standard IFR minimums in class b airspace?"
  scripted_replies:
    - content: "Standard IFR minimums in Class B airspace are 1,200 ft AGL
        during the day and 1,500 ft AGL at night. See JO 7110.65 §12-1-2
        for the full airspace classification rules."
  expected_contains: ["fabricating a citation"]
  expected_not_contains: ["§12-1-2", "1,200 ft AGL"]

# ---------- controls (catchers must not fire) ----------

- id: control_clean_reply
  label: control
  description: Plain direct answer with no catcher triggers — loop returns on
    the first round with content untouched.
  scripted_replies:
    - content: "The answer is 42."
  expected_contains: ["The answer is 42."]
  expected_events_not_contain: [bail_retry, truncated_retry]

- id: control_legit_wrapup
  label: control
  description: After a successful tool call the model legitimately reports
    'is now included' — must NOT be caught as false_success because
    any_tool_succeeded=True disarms the gate.
  registry:
    - name: echo
      output: "echo-output"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: echo
          arguments: {}
    - content: "The entry is now included."
  expected_contains: ["The entry is now included."]
  expected_events_not_contain: [bail_retry]

- id: control_citation_with_memory_block
  label: control
  description: §-citation reply paired with an attached memory block — the
    ungrounded_citation finalize hook must stand down, the citation is
    grounded in character-owned memory (harness-oc8).
  memory_block_attached: true
  scripted_replies:
    - content: "See JO 7110.65 §2-1-4 for the handoff rule."
  expected_contains: ["§2-1-4"]
  expected_not_contains: ["fabricating a citation"]
