# Tool-loop failure corpus fixture (harness-cfm7).
#
# Replayed by `harness eval tool-loop`. Each entry scripts a sequence
# of model replies and scores the final ToolLoopResult against
# contains / not_contains assertions. `label` names the orchestrator
# catcher the scenario stresses — the attribution harness disables one
# catcher at a time and reports which scenarios it uniquely saves.
#
# Scenario schema:
#   id                        unique slug
#   label                     catcher name (see CATCHER_NAMES) or 'control'
#   description               one-line rationale
#   messages                  initial thread (default: one user 'hi' turn)
#   scripted_replies          list of ModelReply shapes the scripted
#                             adapter dequeues in order
#     content                 assistant text (may be empty)
#     tool_calls              list of {name, arguments}
#     was_truncated           bool
#     had_unparseable_call    bool
#   registry                  list of mock tools: {name, output, success, tier}
#   max_rounds                default 8
#   expected_contains         substrings that MUST appear in final content
#   expected_not_contains     substrings that MUST NOT appear
#   expected_fallback         bool — true if the fabrication-exhaustion
#                             fallback is expected to fire
#   expected_events_contain   ToolLoopEvent kinds that must appear
#   expected_events_not_contain  kinds that must NOT appear
#   expected_messages_contain    substrings that must appear somewhere
#                                across result.messages (assistant +
#                                tool-role content)
#   expected_messages_not_contain opposite of above

# ---------- bail catchers (text-shape → nudge → retry → fallback) ----------

- id: teaser_trailing
  label: teaser
  description: |
    Trailing 'Let me <X>:' with no tool_call and no action verb that
    would also trip tool_intent. teaser fires on the intent + colon
    shape regardless of the verb; tool_intent fires only on specific
    action verbs (search / look up / check / read / run / fetch /
    etc.). Picks verbs OUTSIDE tool_intent's list so the attribution
    eval can prove teaser does load-bearing work — disabling teaser
    must change the outcome, which requires tool_intent to NOT pick
    up the slack on these replies (harness-27zr surfaced this when
    the expansion to 'use ... tool' / 'proceed with' / interposing
    cluster widened tool_intent's coverage).
  scripted_replies:
    - content: "Sure. Let me think about that:"
    - content: "Okay. I'll consider it carefully:"
    - content: "Let me ponder this for a moment:"
  expected_fallback: true
  expected_events_contain: [bail_retry]
  expected_not_contains: ["Let me think about that"]

- id: false_success_no_tool
  label: false_success
  description: Model claims 'has been added' without calling any write tool.
  scripted_replies:
    - content: "Got it — the entry has been added to the config."
    - content: "Great, the value is now included."
    - content: "The item has been updated successfully."
  expected_fallback: true
  expected_events_contain: [bail_retry]

- id: empty_reply_after_tools_silent_giveup
  label: empty_reply_after_tools
  description: |
    Mark's 2026-05-20T22:01 GTA session repro (harness-uk34) on
    Qwen3-Coder-30B. Model successfully read 3 files via read_file
    (a content tool), then on the next round emitted EMPTY content
    + NO tool calls. Before this catcher, the regex-shape bail
    catchers couldn't see empty content; the orchestrator treated
    Continue as 'final answer' and exited with the sentinel.
    EmptyReplyAfterToolsHook fires Nudge on every empty round
    until retries exhaust and fabrication_fallback substitutes.

    Reply 0 calls read_file. Replies 1+ are empty — the model
    'giving up' without producing output. Three empty retries
    exhaust the bail budget; canned fallback substitutes.
  registry:
    - name: read_file
      output: "# placeholder doc body"
  messages:
    - role: user
      content: "Read docs/spec.md and summarize."
  scripted_replies:
    - content: ""
      tool_calls:
        - name: read_file
          arguments: { path: "docs/spec.md" }
    - content: ""
    - content: ""
    - content: ""
    - content: ""
  expected_fallback: true
  expected_events_contain: [bail_retry]

- id: intent_restatement_loop_gta2_followup
  label: intent_restatement_loop
  description: |
    Mark's 2026-05-21 GTA2 follow-up session repro (harness-a4q4)
    on Qwen3-Coder-30B. Replies share a ~56-char opening
    ("Now I'll create the game.js file with the implementation")
    under the "Now I'll" intent-phrase — below the 100-char floor
    that PreambleLoopHook (harness-jwp3) needs. IntentRestatement
    LoopHook's intent-phrase gate + lower 30-char LCP floor
    catches the shorter loop. Reply 0 trips Teaser ('Let me … :')
    to seed the discarded_openings ledger; replies 1-3 share the
    intent-phrase opening with reply 0 and trip only this catcher;
    retries exhaust and fabrication_fallback substitutes.
  scripted_replies:
    - content: "Now I'll create the game.js file with the implementation. Let me start writing this:"
    - content: "Now I'll create the game.js file with the implementation. The structure needs to be built out section by section."
    - content: "Now I'll create the game.js file with the implementation. The structure starts with the canvas setup."
    - content: "Now I'll create the game.js file with the implementation. The structure begins with the game loop."
  expected_fallback: true
  expected_events_contain: [bail_retry]

- id: preamble_loop_gta_runaway
  label: preamble_loop
  description: |
    Mark's 2026-05-20 GTA2 session repro (harness-jwp3). Model
    emits the same opening sentence across multiple discarded
    retries. Reply 0 trips Teaser ('Let me … :') which captures
    the opening into discarded_openings; reply 1 onward also opens
    with the same sentence, so PreambleLoopHook fires (placed
    first in the bail order) on each subsequent retry. Three
    matching retries exhaust the bail budget and the canned
    fabrication_fallback substitutes.
  scripted_replies:
    # Shared opening spans ≥ _PREAMBLE_LOOP_MIN_LENGTH chars
    # (~118 chars) so PreambleLoopHook's LCP check trips. The
    # openings deliberately DO NOT start with an intent-phrase
    # ('I'll', 'Let me', 'Now I'll', etc.) so the structural
    # IntentRestatementLoopHook (harness-a4q4) doesn't double-cover
    # this case — preamble_loop carries unique attribution load.
    # Reply 0 trips Teaser ('Let me … :') to seed the discarded
    # openings ledger; replies 1-3 share the noun-phrase opening
    # with reply 0 and trip ONLY preamble_loop. Disable
    # preamble_loop and replies 1-3 pass as final answers.
    - content: "The full GTA2 browser clone needs to follow the specification including all required mechanics and visual details. Let me create a proper implementation now:"
    - content: "The full GTA2 browser clone needs to follow the specification including all required mechanics and visual details. The implementation is straightforward but requires careful structural choices throughout the codebase."
    - content: "The full GTA2 browser clone needs to follow the specification including all required mechanics and visual details. The implementation is straightforward and the structure needs to be built out one section at a time."
    - content: "The full GTA2 browser clone needs to follow the specification including all required mechanics and visual details. The implementation needs to start with the core skeleton and grow from there."
  expected_fallback: true
  expected_events_contain: [bail_retry]

- id: edit_file_dedup_loop_old_string_mismatch
  label: edit_file_dedup_loop
  description: |
    Mark's 2026-05-21 GTA2 §6 halt repro (harness-w0gw). Model emits
    edit_file with an old_string that doesn't match the file (often
    fabricated or stale mental model). edit_file returns an error
    response that now inlines the current file contents. Model
    re-emits a similar edit_file call rather than reading + quoting
    the inlined contents. EditFileDedupLoopHook fires pre_tool on the
    second call, Skips with a recovery nudge naming the path and
    explicit next steps. Breaks the loop at the source rather than
    letting duplicate_call's generic dedup nudge fire (which the
    model routinely ignores).
  registry:
    - name: edit_file
      output: |
        error calling edit_file: old_string not found in game.js. Use
        the file contents below to construct an old_string that
        matches verbatim (including indentation and trailing
        whitespace).
        --- CURRENT CONTENTS OF game.js (BEGIN) ---
        let keys = {};
        --- END game.js ---
      success: false
  messages:
    - role: user
      content: "Extend game.js per §6."
  scripted_replies:
    - content: ""
      tool_calls:
        - name: edit_file
          arguments:
            path: game.js
            old_string: "// content the model fabricated"
            new_string: "let peds = [];"
    - content: ""
      tool_calls:
        - name: edit_file
          arguments:
            path: game.js
            old_string: "// still doesn't match the actual file"
            new_string: "let peds = [];"
    - content: "The edit failed because my old_string didn't match what's in game.js."
  expected_events_contain: [tool_call_deduped]

- id: post_dup_completion_claim_gta_session
  label: post_dup_completion_claim
  description: |
    Mark's 2026-05-20 GTA2 session repro (harness-2h3m). Model
    edits a file, re-emits the identical edit_file call (which
    DuplicateCallHook short-circuits with a dedup-prefixed
    result), then every subsequent reply paraphrases the dedup
    as "task done" and emits an itemized completion summary.
    PostDupCompletionClaimHook fires on (last tool output is a
    dedup) + (reply has completion-language + ≥3-item list);
    the bail nudge fires three times, retries exhaust, and the
    fabrication fallback substitutes the canned refusal.
  registry:
    - name: edit_file
      output: "edited game.js: 1 replacement(s), +500 bytes"
  messages:
    - role: user
      content: "Finish implementing the GTA2 spec at docs/gta/spec/gta2-spec.md."
  scripted_replies:
    - content: ""
      tool_calls:
        - name: edit_file
          arguments:
            path: game.js
            old_string: "// placeholder"
            new_string: "// player car physics"
    - content: ""
      tool_calls:
        - name: edit_file
          arguments:
            path: game.js
            old_string: "// placeholder"
            new_string: "// player car physics"
    - content: |
        I have successfully created a GTA2 browser clone that
        implements the core functionality according to the spec.
        The implementation includes:

        1 Basic game structure - vanilla JavaScript, no deps
        2 Canvas setup - the spec's exact 960x640 HTML skeleton
        3 Map rendering - buildings, roads, sidewalks
    - content: |
        Successfully implemented the full feature set:

        1 Driving physics with acceleration and braking
        2 Camera following with map clamping
        3 Pedestrian wandering and panic behavior
        4 HUD with score, multiplier, wanted level
    - content: |
        I have successfully completed the implementation:

        1 All required visual elements
        2 Complete driving mechanics
        3 Full HUD with every required indicator
  expected_fallback: true
  expected_events_contain: [bail_retry]

