# ---------- mechanism catchers ----------

- id: truncated_auto_widen
  label: truncated
  description: First reply was_truncated=True — orchestrator doubles token cap
    and retries; second reply lands a clean final answer.
  scripted_replies:
    - content: "partial reply that got cut off"
      was_truncated: true
    - content: "full final answer"
  expected_contains: ["full final answer"]
  expected_not_contains: ["partial reply"]
  expected_events_contain: [truncated_retry]

- id: unparseable_tool_call
  label: unparseable
  description: First reply had_unparseable_call=True — orchestrator asks the
    model to re-emit the JSON; second reply is a clean answer.
  scripted_replies:
    - content: "tried to call a tool but the JSON was malformed"
      had_unparseable_call: true
    - content: "here is the answer"
  expected_contains: ["here is the answer"]
  expected_messages_contain: ["<tool_call>…</tool_call>"]
  expected_events_contain: [bail_retry]

- id: fabricated_itemization_regen
  label: fabricated_itemization
  description: Follow-up fabrication (harness-f5x). User asks for more
    detail on item N from an earlier fetch; model regenerates a fake
    "here are the first N articles" summary list without calling
    fetch_url. The itemization catcher fires on the regen shape; every
    retry keeps regenerating so the fabrication-exhaustion fallback
    takes over.
  messages:
    - role: user
      content: "Yes, get more details on 8"
  scripted_replies:
    - content: "Sure — here are the first 5 articles from the BBC News website:\n1. Iran blockade...\n2. US-Iran standoff..."
    - content: "Let's focus on one of the top stories. Here are the first 5 headlines:"
    - content: "Here's a rundown of the headlines:"
  expected_fallback: true
  expected_events_contain: [bail_retry]
  expected_not_contains: ["here are the first"]

- id: argument_grounding_leaked_domain
  label: argument_grounding
  description: Router or main model emits a tool call whose `query` names a
    domain (`dailydrop.fm`) that the user never mentioned — classic
    retrieved-memory leak when the user actually asked about
    stackoverflow. Grounding hook skips the call with a re-plan nudge;
    the recovery round gives a plain answer (harness-7od).
  messages:
    - role: user
      content: go to stackoverflow and summarize the first question there
  registry:
    - name: search_web
      output: "search-result"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_web
          arguments: {"query": "dailydrop.fm", "max_results": 1}
    - content: "I couldn't figure out the right search for that — can you paste the stackoverflow URL?"
  expected_contains: ["stackoverflow"]
  expected_messages_contain:
    - "grounded-args check failed"
    - "dailydrop"
  expected_events_contain: [tool_call_deduped]
  expected_messages_not_contain: ["search-result"]

- id: scope_violation_mexico_for_south_america
  label: scope_violation
  description: |
    Session repro 2026-05-19 (avocado query, 1st session): user asked
    'which south american country exports the most avocados?'.
    Reply named Mexico — which is in North America (UN M49), not
    South America. ScopeViolationHook fires; retry produces a
    corrected answer naming an actual SA country.
  registry:
    - name: search_web
      output: "stub"
  messages:
    - role: user
      content: "which south american country exports the most avocados?"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_web
          arguments: { query: "south american avocado exporter" }
    - content: |
        The top avocado exporter in South America is Mexico. Mexico
        exported $4 billion in 2024, accounting for 41.9% of global
        exports.
    - content: |
        Correction — Mexico is in North America, not South America.
        Per the source data filtered to South American countries
        only, the top exporter is Peru.
  expected_contains: ["Peru", "Correction"]
  expected_events_contain: [bail_retry]

- id: self_contradicting_rank_chile_repro
  label: self_contradicting_rank
  description: |
    Session repro 2026-05-19 (avocado query, 2nd session): final reply
    says Chile is BOTH the top South American avocado exporter AND
    'making it the third highest exporter in South America'. The
    'making it' idiom back-references Chile. Self-falsifying.
    SelfContradictingRankHook fires; retry produces a corrected
    reply that drops the 'top' claim and acknowledges Chile is #3.
    The real top-SA exporter is Peru — out of scope for this catcher;
    scope_violation (harness-lyyr) is the companion that catches the
    wrong-pick-from-data shape.
  registry:
    - name: search_web
      output: "stub"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_web
          arguments: { query: "south american avocado exporter" }
    - content: |
        The top South American avocado exporter is Chile, as reported
        by WorldStopExports. Chile exported $291.6 million worth of
        avocados in 2024, making it the third highest exporter in
        South America.
    - content: |
        Correction — the source ranks Chile as the third largest
        avocado exporter in South America, not the top. Per the
        2024 data, a different country leads the region; check the
        article for the #1 entry.
  expected_contains: ["Correction", "third"]
  expected_events_contain: [bail_retry]

- id: edit_file_failure_disable_after_three_failures
  label: edit_file_failure_disable
  description: |
    Loop run 26c39558 repro: three earlier catchers
    (edit_file_dedup_loop, duplicate_call, repeat_detector) fired
    during turn 2 trying to break the cycle, and the model emitted
    yet another broken edit_file in turn 3 — existing catchers are
    advisory and the model treated them as suggestions.
    EditFileFailureDisableHook is the hard stop: after 3 failed
    edit_file calls on the same path within the turn, subsequent
    calls on that path are rejected with a structured nudge pointing
    the model at write_file or read_file as recovery paths.
  registry:
    - name: edit_file
      output: "ValueError: old_string not found in game.js"
      success: false
  scripted_replies:
    - content: ""
      tool_calls:
        - name: edit_file
          arguments: { path: "game.js", old_string: "v1", new_string: "x" }
    - content: ""
      tool_calls:
        - name: edit_file
          arguments: { path: "game.js", old_string: "v2", new_string: "y" }
    - content: ""
      tool_calls:
        - name: edit_file
          arguments: { path: "game.js", old_string: "v3", new_string: "z" }
    - content: ""
      tool_calls:
        - name: edit_file
          arguments: { path: "game.js", old_string: "v4", new_string: "w" }
    - content: |
        edit_file keeps failing. Switching to write_file for the
        wholesale replacement.
  expected_contains: ["write_file"]
  expected_events_contain: [tool_call_deduped]
  expected_messages_contain: ["edit_file", "disabled"]

- id: load_tool_loop_caught_at_third_no_change
  label: load_tool_loop
  description: |
    Loop run 26c39558 turn 4 repro: after tool_search got blocked by
    its own loop catcher, model pivoted to load_tool spam on tools
    already in the active working set (read_file, grep, list_dir,
    tool_search) — each returning 'no change'. LoadToolLoopHook now
    Skips the 3rd no-op call with a directive nudge pointing the
    model at submit_assessment / submit_implementation_complete as
    the legitimate exit paths.
  registry:
    - name: load_tool
      output: "load_tool: 'read_file' is already in your active working set; no change."
  scripted_replies:
    - content: ""
      tool_calls:
        - name: load_tool
          arguments: { name: "read_file" }
    - content: ""
      tool_calls:
        - name: load_tool
          arguments: { name: "grep" }
    - content: ""
      tool_calls:
        - name: load_tool
          arguments: { name: "list_dir" }
    - content: |
        I can't find a new tool to load. Reporting blocker.
  expected_contains: ["blocker"]
  expected_events_contain: [tool_call_deduped]
  expected_messages_contain: ["load_tool loop"]

- id: tool_search_loop_caught_at_third_call
  label: tool_search_loop
  description: |
    Session 2026-05-19 repro: user asked 'what is the national bird
    of Kenya?', model called tool_search SEVEN times with refined
    queries (including search-engine operators like 'site:wikipedia
    .org') and never called load_tool, ending with a fabricated
    answer. ToolSearchLoopHook now Skips the 3rd tool_search call
    with a directive nudge naming load_tool as the required next
    step. The recovery reply acknowledges the dead-end and either
    asks the user to paste a URL or tells them plainly.
  registry:
    - name: tool_search
      output: "stub tool_search output"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: tool_search
          arguments: { query: "kenya national bird" }
    - content: ""
      tool_calls:
        - name: tool_search
          arguments: { query: "national bird kenya wiki" }
    - content: ""
      tool_calls:
        - name: tool_search
          arguments: { query: "kenya national bird site:wikipedia.org" }
    - content: |
        I couldn't pin down a search tool from the catalog. Paste
        a source URL or rephrase the question — discovery loops
        aren't getting me anywhere new.
  expected_contains: ["Paste"]
  expected_events_contain: [tool_call_deduped]
  expected_messages_contain: ["tool_search loop", "load_tool"]

- id: duplicate_call_short_circuit
  label: duplicate_call
  description: Model re-emits the same (name, args) tool call across rounds —
    orchestrator re-issues the prior result with a duplicate prefix
    (harness-v5w) so success/error stays consistent.
  registry:
    - name: echo
      output: "echo-output"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: echo
          arguments: {}
    - content: ""
      tool_calls:
        - name: echo
          arguments: {}
    - content: "done"
  expected_contains: ["done"]
  expected_events_contain: [tool_call_deduped]
  expected_messages_contain: ["DUPLICATE CALL"]

- id: paired_meta_confirm_strip
  label: paired_meta_confirm_strip
  description: Tool call AND meta-confirm prose in the same assistant reply —
    orchestrator strips the content so the wrap-up round doesn't see
    hallucinated confirmation dialog in history.
  registry:
    - name: echo
      output: "echo-output"
  scripted_replies:
    - content: "Would you like me to proceed with the change?"
      tool_calls:
        - name: echo
          arguments: {}
    - content: "done"
  expected_contains: ["done"]
  expected_messages_not_contain: ["Would you like me to proceed"]

- id: fabrication_fallback_exhaustion
  label: fabrication_fallback
  description: Every retry still trips a fabrication catcher — fallback swaps
    in the canned refusal rather than surfacing the hallucination
    (harness-24xj).
  scripted_replies:
    - content: "I will search the web now."
    - content: "Let me search the web."
    - content: "I'll search the web."
  expected_fallback: true
  expected_not_contains: ["search the web"]

- id: numeric_fabrication_cross_row_prose
  label: numeric_fabrication
  description: After a successful search_memory call that returned a pipe
    table, the model writes a prose claim that swaps a neighbor row's
    value onto the asked-about label ('MH class is 50 miles' vs. the
    retrieved `|MH|Under 50|25|`). No pipe table in the reply, so
    table_fabrication doesn't fire; numeric_fabrication catches it via
    header+label structural lookup (harness-5uq).
  registry:
    - name: search_memory
      output: "[0.033] ALTITUDE AND DISTANCE LIMITATIONS\n  lesson: JO_7110.65 §4-1-1\n  |Class|Power (watts)|Distance (miles)|\n|---|---|---|\n|CL|Under 25|15|\n|MH|Under 50|25|\n|H|50 - 1,999|50|\n|HH|2,000 or more|75|\n"
  messages:
    - role: user
      content: "What is the usable distance for an MH class RBN?"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: {"query": "MH class RBN usable distance"}
    - content: "The usable distance for an MH class RBN is 50 miles, per JO 7110.65 §4-1-1."
  expected_contains: ["fabricated row"]
  expected_not_contains: ["50 miles"]

- id: table_fabrication_grounded_bad_row
  label: table_fabrication
  description: Citation-scoped character cites a real section after a
    successful search_memory call, but reconstructs a table row the
    tool output didn't contain. The grounding tool disarms
    ungrounded_citation (citation IS grounded); table_fabrication
    catches the fabricated row via verbatim-compare against the tool
    output. Prose uses generic wording ('the values for the MH band')
    so numeric_fabrication's labeled-claim regex doesn't also fire —
    attribution eval needs ONLY table_fabrication to save this case
    (harness-5uq).
  registry:
    - name: search_memory
      output: "[0.033] ALTITUDE AND DISTANCE LIMITATIONS\n  lesson: JO_7110.65 §4-1-1\n  |Type|Power (watts)|Distance (miles)|\n|---|---|---|\n|CL|Under 25|15|\n|MH|Under 50|25|\n|H|50 - 1,999|50|\n|HH|2,000 or more|75|\n"
  messages:
    - role: user
      content: "Show me TBL 4-1-2."
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: {"query": "TBL 4-1-2 L/MF Radio Beacon"}
    - content: "Here is TBL 4-1-2 from JO 7110.65 §4-1-1:\n\n| Type | Power (watts) | Distance (miles) |\n|---|---|---|\n| MH | Under 50 | 50 |\n| H | 50 - 1,999 | 50 |\n"
  expected_contains: ["fabricated row"]
  expected_not_contains: ["| MH | Under 50 | 50 |"]

- id: ambiguous_context_balloon_variant_repro
  catchers: atc
  label: ambiguous_context
  description: Session 2026-04-24 repro. User asked about 'a balloon'
    without specifying variant; model assumed 'unmanned free balloon'
    silently and answered §9-6 procedures. The JO handles unmanned
    free balloons and manned balloons (aircraft rules) differently, so
    the model should have asked first. ambiguous_context nudges; retry
    produces a clarifying question.
  registry:
    - name: search_memory
      output: "[0.032] DERELICT BALLOONS\n  lesson: JO_7110.65 §9-6-2\n\n[0.030] APPLICATION\n  lesson: JO_7110.65 §9-6-1\n"
  messages:
    - role: user
      content: "a single prop squawking 1200 and a balloon are intersecting, who has the right of way?"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: {"query": "balloon right of way"}
    # Observed reply: silently assumed unmanned free balloon.
    - content: "When a single-engine propeller aircraft and an unmanned free balloon are intersecting, per JO 7110.65 §9-6-1 the aircraft typically has the right of way. Controllers issue traffic advisories to affected aircraft."
    # Retry after ambiguous_context nudge — asks for clarification.
    - content: "Before I answer: are you asking about a manned balloon (handled under general aircraft rules) or an unmanned balloon (§9-6 procedures)? The JO treats them differently, so the answer depends on which you mean."
  expected_contains: ["manned", "unmanned"]
  expected_events_contain: [bail_retry]

- id: scope_redirect_roosters_repro
  catchers: atc
  label: scope_redirect
  description: Session 2026-04-24 repro. User asked 'do roosters lay
    eggs' (clearly non-aviation). Model bled ATC content into the
    reply instead of scope-redirecting. Reply shape is crafted to
    avoid every other bail catcher (no reserved squawk code, no count
    claim, has a citation, no fabrication shape) so scope_redirect
    is the ONLY hook that saves this scenario — gives the attribution
    eval a clean uniqueness signal.
  registry:
    - name: search_memory
      # Noisy low-relevance output — mimics what SearchMemoryTool
      # returns for out-of-scope queries (uniform ~0.016 scores).
      output: "[0.031] PIREP SOLICITATION AND DISSEMINATION\n  lesson: JO_7110.65 §2-6-1\n\n[0.016] BIRD ACTIVITY INFORMATION\n  lesson: JO_7110.65 §2-1-22\n"
  messages:
    - role: user
      content: "do roosters lay eggs in the morning"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: {"query": "do roosters lay eggs"}
    # Reply bleeds prior-turn content: cited, no reserved code, no
    # count mismatch. Only scope_redirect catches the mismatch.
    - content: "Per JO 7110.65 §4-1-1, the usable distance for an MH class RBN is 25 miles for all altitudes. Controllers reference this when assigning routes through radar coverage."
    # Retry after scope_redirect nudge.
    - content: "That question is outside JO 7110.65. I am a specialist for FAA Air Traffic Control procedures only and cannot answer biology questions."
  expected_contains: ["outside JO 7110.65", "specialist"]
  expected_not_contains: ["MH class RBN", "25 miles"]
  expected_events_contain: [bail_retry]

- id: reserved_squawk_code_7500_repro
  catchers: atc
  label: reserved_squawk_code
  description: Session 2026-04-24 repro. User asked to correct the
    phraseology 'Services stopped, squawk seventy five hundred'. Model
    fixed the shell ('Services stopped' -> 'Radar service terminated')
    but propagated the reserved 7500 hijack code as 'squawk seven five
    hundred', producing a 'correct' phraseology line that still assigns
    an emergency transponder code. reserved_squawk_code nudges; retry
    substitutes 'squawk one two zero zero' (or 'squawk VFR') per §5-2-7
    and flags that 7500 is the hijack reserved code per §5-2-5.
  registry:
    - name: search_memory
      output: "[0.029] TERMINATION OF SERVICE\n  lesson: JO_7110.65 §7-6-11 (Basic Radar Service to VFR Aircraft − Terminal — TERMINATION OF SERVICE)\n  Advise the aircraft that radar service is terminated. PHRASEOLOGY - RADAR SERVICE TERMINATED.\n\n[0.023] VFR CODE ASSIGNMENTS\n  lesson: JO_7110.65 §5-2-7 (Beacon/ADS-B Systems — VFR CODE ASSIGNMENTS)\n  Instruct a VFR aircraft for which radar advisory service is being terminated, to squawk VFR. PHRASEOLOGY - SQUAWK VFR. or SQUAWK 1200.\n"
  messages:
    - role: user
      content: 'Correct the following radar phraseology: "Services stopped, squawk seventy five hundred"'
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: {"query": "radar service termination phraseology"}
    - content: "The correct phraseology is:\n\n\"Radar service terminated, squawk seven five hundred.\"\n\nPer JO 7110.65 §7-6-11."
    - content: "Two corrections are needed here.\n\n1. \"Services stopped\" -> \"Radar service terminated\" (§7-6-11).\n2. 7500 is the reserved hijack / unlawful interference code (§5-2-5) — controllers never assign it. For VFR radar service termination, the correct code is 1200 (or \"squawk VFR\") per §5-2-7.\n\nCorrected: \"Radar service terminated, squawk one two zero zero.\""
  expected_contains: ["hijack", "§5-2-5", "one two zero zero"]
  expected_not_contains: ["squawk seven five hundred"]
  expected_events_contain: [bail_retry]

- id: list_count_mismatch_four_purposes
  label: list_count_mismatch
  description: Session 2026-04-24 repro. User asked for '4 specific Primary
    Purposes'; model over-agreed with the wrong premise, wrote 'The four
    specific primary purposes ... are as follows:' and listed 3. Internal
    inconsistency within one reply. list_count_mismatch nudges; retry
    round restates the count to match what §2-1-1 actually lists and
    flags that the source doesn't have 4 items.
  registry:
    - name: search_memory
      output: "[0.031] ATC SERVICE\n  lesson: JO_7110.65 §2-1-1 (General — ATC SERVICE)\n  **a.** The primary purpose of the ATC system is to prevent a collision involving aircraft operating in the system.\n  **b.** In addition to its primary purpose, the ATC system also:\n    **1.** Provides a safe, orderly, and expeditious flow of air traffic.\n    **2.** Supports National Security and Homeland Defense missions.\n"
  messages:
    - role: user
      content: "List the 4 specific Primary Purposes of Air Traffic Control"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: {"query": "primary purposes of Air Traffic Control"}
    - content: "The four specific primary purposes of Air Traffic Control (ATC) are as follows:\n\n1. Prevent a collision involving aircraft operating in the system.\n2. Provide a safe, orderly, and expeditious flow of air traffic.\n3. Support National Security and Homeland Defense missions.\n\nThese are outlined in JO 7110.65 §2-1-1."
    - content: "Per JO 7110.65 §2-1-1, the source lists 3 items (1 primary purpose plus 2 additional roles), not 4:\n\n1. Prevent a collision involving aircraft (the primary purpose).\n2. Provide a safe, orderly, and expeditious flow of air traffic.\n3. Support National Security and Homeland Defense missions."
  expected_contains: ["3 items", "§2-1-1"]
  expected_events_contain: [bail_retry]

- id: missing_citation_purpose_of_order
  citation_grammar: atc
  label: missing_citation
  description: Session 2026-04-24 repro. User asked 'What is the purpose
    of 7110.65 as it pertains to ATC?'. search_memory surfaced §1-1-1.
    Model paraphrased the content correctly but omitted the §-anchor.
    missing_citation nudges the model to add it; retry produces a cited
    reply. Inverse of ungrounded_citation (which halts fabricated cites
    without grounding) — this catches grounded-but-uncited replies.
  registry:
    - name: search_memory
      output: "[0.033] PURPOSE OF THIS ORDER\n  lesson: JO_7110.65 §1-1-1 (Introduction — PURPOSE OF THIS ORDER)\n  This order prescribes air traffic control procedures and phraseology for use by persons providing air traffic control services. Controllers are required to be familiar with the provisions of this order that pertain to their operational responsibilities.\n"
  messages:
    - role: user
      content: "What is the purpose of 7110.65 as it pertains to Air Traffic Control?"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: {"query": "purpose of 7110.65 ATC"}
    - content: "The purpose of FAA Order JO 7110.65 as it pertains to Air Traffic Control is to prescribe air traffic control procedures and phraseology for use by persons providing air traffic control services. The order is designed to ensure that controllers operate with a uniform set of rules across the National Airspace System."
    - content: "Per JO 7110.65 §1-1-1, the purpose of the order is to prescribe air traffic control procedures and phraseology for use by persons providing air traffic control services."
  expected_contains: ["§1-1-1", "JO 7110.65"]
  expected_events_contain: [bail_retry]

- id: fabricated_section_invented_anchor
  label: fabricated_section
  description: Model cited §99-99-99 — a section that doesn't structurally
    exist in the corpus. valid_section_anchors only carries §3-10-3 (the
    real section the grounding tool surfaced). FabricatedSectionHook
    (harness-aise) Nudges with the offending §-anchor named so the model
    can either drop it on retry or call search_memory for a real one.
    Different from ungrounded_citation (no tool ran) and
    low_confidence_fallback (tool ran, weak score) — this is a
    structural existence check.
  valid_section_anchors:
    - §3-10-3
  registry:
    - name: search_memory
      output: "[0.033] SAME RUNWAY SEPARATION\n  lesson: JO_7110.65 §3-10-3 (Airport Traffic Control — SAME RUNWAY SEPARATION)\n  Aircraft on the same runway must be separated per the table.\n"
  messages:
    - role: user
      content: "What's the rule for same-runway separation?"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: { query: "same runway separation" }
    - content: "Per JO 7110.65 §99-99-99, same-runway separation depends on aircraft category and weight class."
    - content: "Per JO 7110.65 §3-10-3, same-runway separation depends on aircraft category and the table in the section."
  expected_contains: ["§3-10-3"]
  expected_not_contains: ["§99-99-99"]
  expected_events_contain: [bail_retry]

- id: ungrounded_citation_no_grounding
  label: ungrounded_citation
  description: Out-of-scope question for a citation-scoped character
    produces a fabricated §-citation reply with no memory block attached
    and no search_memory / fact_search call. Finalize hook swaps in a
    character-agnostic refusal so the user doesn't see the real-looking
    but fabricated section number (harness-oc8).
  messages:
    - role: user
      content: "what are standard IFR minimums in class b airspace?"
  scripted_replies:
    - content: "Standard IFR minimums in Class B airspace are 1,200 ft AGL
        during the day and 1,500 ft AGL at night. See JO 7110.65 §12-1-2
        for the full airspace classification rules."
  expected_contains: ["fabricating a citation"]
  expected_not_contains: ["§12-1-2", "1,200 ft AGL"]

- id: uncited_substantive_reply_redirect_then_answer
  citation_grammar: atc
  scope_redirect_template: "Outside JO 7110.65 — ask airton_c."
  label: uncited_substantive_reply
  description: harness-zsbz repro (2026-05-14 wedding-ring session). User
    asks an off-topic question. Retrieval surfaces nothing useful (search
    runs but returns a tangential hit). Model's bail-phase retry prefixes
    a scope-redirect marker ('JO 7110.65 doesn't cover it') but keeps
    going with general-knowledge content past the redirect. Bail-phase
    MissingCitationHook nudges once on round 1 (the soft-limit tightening
    catches the long redirect-then-answer); round 2 retries but still
    can't anchor, so the new finalize-phase UncitedSubstantiveReplyHook
    Halts with the character's scope_redirect_template. Complementary to
    ungrounded_citation (no tool ran) and low_confidence_fallback (weak
    cite). This catches 'tool ran, no cite, redirect-marker-but-long'.
  registry:
    - name: search_memory
      output: "[0.012] PURPOSE OF THIS ORDER\n  lesson: JO_7110.65 §1-1-1\n  Procedural air traffic control content.\n"
  messages:
    - role: user
      content: "If Tom marries Alice but is already married to Dolly, which finger should he wear his second band on?"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: { query: "second marriage ring finger" }
    - content: "That's a pilot-facing question — airton_c is the generalist. JO 7110.65 doesn't cover it. In real-life practice, it's a personal decision based on cultural norms and local customs. Typically, the second ring or any unused ring on the left hand is used for subsequent marriages. However, there's no universal rule and many people choose differently based on cultural background or family tradition."
    - content: "That's a pilot-facing question — airton_c is the generalist. JO 7110.65 doesn't cover it. In real-life practice, this is a personal decision based on cultural norms and local customs. Typically, the second ring or any unused ring on the left hand is used. However, there's no universal rule and many people choose differently."
    - content: "That's a pilot-facing question. airton_c is the generalist. JO 7110.65 doesn't cover it. In real-life practice this is a personal decision based on cultural norms and local customs. Typically the second ring or any unused ring on the left hand is used. However there's no universal rule and many people choose differently for cultural reasons."
  expected_contains: ["airton_c"]
  expected_not_contains: ["personal decision", "cultural norms", "left hand"]

- id: low_confidence_fallback_weak_retrieval
  label: low_confidence_fallback
  description: search_memory ran and returned a hit but the top score
    was below the confidence threshold AND the § the model cited
    wasn't in the tool's declared grounded-citation set. Finalize
    hook swaps in LOW_CONFIDENCE_FALLBACK — semantically tighter
    than ungrounded_citation (which fires when NO tool ran at all).
  registry:
    - name: search_memory
      output: "[0.310] tangential-match title\n  body text unrelated to the query"
      hit_score: 0.31
      grounded_citations: []
  scripted_replies:
    - content: ""
      tool_calls:
        - name: search_memory
          arguments: { query: "class b IFR minimums" }
    - content: "Standard IFR minimums in Class B are defined in §12-1-2 of JO 7110.65."
  expected_contains: ["confidence threshold", "Check the relevant section"]
  expected_not_contains: ["§12-1-2"]

# ---------- controls (catchers must not fire) ----------

- id: control_clean_reply
  label: control
  description: Plain direct answer with no catcher triggers — loop returns on
    the first round with content untouched.
  scripted_replies:
    - content: "The answer is 42."
  expected_contains: ["The answer is 42."]
  expected_events_not_contain: [bail_retry, truncated_retry]

- id: control_legit_wrapup
  label: control
  description: After a successful tool call the model legitimately reports
    'is now included' — must NOT be caught as false_success because
    any_tool_succeeded=True disarms the gate.
  registry:
    - name: echo
      output: "echo-output"
  scripted_replies:
    - content: ""
      tool_calls:
        - name: echo
          arguments: {}
    - content: "The entry is now included."
  expected_contains: ["The entry is now included."]
  expected_events_not_contain: [bail_retry]

- id: control_citation_with_memory_block
  label: control
  description: §-citation reply paired with an attached memory block — the
    ungrounded_citation finalize hook must stand down, the citation is
    grounded in character-owned memory (harness-oc8).
  memory_block_attached: true
  scripted_replies:
