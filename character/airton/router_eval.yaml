# Router eval fixture — prompts the intent router should classify
# correctly. Loaded by `harness eval router`. Each entry:
#
#   prompt: the user message
#   expected_tool: the tool name the router should pick, or `null` for
#     'no tool needed' (casual chat, greeting, arithmetic the main
#     model can answer directly).
#   expected_args (optional): list of argument names that MUST appear
#     in the router's `arguments` dict. Missing args = partial credit
#     (tool right, args wrong).
#
# Goal: lock in router quality so a model swap or prompt change
# doesn't silently regress. Keep the mix balanced — ~50% should be
# null so we catch the small model's bias toward over-routing.

- prompt: search the web for bbq restaurants in 85048 tonight
  expected_tool: search_web
  expected_args: [query]

- prompt: look up the latest news on Claude 4.7 pricing
  expected_tool: search_web
  expected_args: [query]

- prompt: find me a good sourdough starter recipe online
  expected_tool: search_web
  expected_args: [query]

- prompt: what's the weather in Phoenix right now
  expected_tool: search_web
  expected_args: [query]

# harness-78z: "do a search for X" where X is an external person is
# search_web, NOT search_memory. The small model had been grabbing
# the verb "search" over the external-entity signal. These pin the
# fix so a router-prompt or model swap can't silently regress.
- prompt: do a search for brad hintze in phoenix, tell me about this person
  expected_tool: search_web
  expected_args: [query]

- prompt: search for acme corp's ceo
  expected_tool: search_web
  expected_args: [query]

# fetch_url — concrete URL or bare domain goes to fetch_url, not
# read_file (harness-057). Hermes-3-3B had been mode-collapsing these
# into read_file and jamming a pseudo search_web call into `path`.
#
# The stackoverflow case pins the "verbatim domain" contract
# (harness-w1z): the router had been copying a dailydrop.fm few-shot's
# args when the user said 'stackoverflow'. `expected_arg_values`
# requires the actual `url` to contain "stackoverflow" — a wrong
# domain fails the eval even if fetch_url + `url` are correct.
- prompt: go to stackoverflow and fetch the first question
  expected_tool: fetch_url
  expected_args: [url]
  expected_arg_values:
    url: stackoverflow

- prompt: go to dailydrop.fm and tell me about the website
  expected_tool: fetch_url
  expected_args: [url]
  expected_arg_values:
    url: dailydrop

- prompt: open https://example.com and summarize the page
  expected_tool: fetch_url
  expected_args: [url]

- prompt: fetch the content of https://docs.python.org/3/library/asyncio.html
  expected_tool: fetch_url
  expected_args: [url]

- prompt: read anthropic.com/news and tell me what's new
  expected_tool: fetch_url
  expected_args: [url]

- prompt: show me what's in src/harness/cli.py
  expected_tool: read_file
  expected_args: [path]

- prompt: open pyproject.toml and tell me what's configured
  expected_tool: read_file
  expected_args: [path]

- prompt: list the files in src/harness/tools
  expected_tool: list_dir

- prompt: grep for FABRICATED_SEARCH in the code
  expected_tool: grep

- prompt: find all tests matching test_router_*
  expected_tool: glob

- prompt: what do you remember about our last session
  expected_tool: search_memory
  expected_args: [query]

- prompt: recall the conversation where we discussed retrieval thresholds
  expected_tool: search_memory
  expected_args: [query]

- prompt: what facts do you know about my preferences
  expected_tool: search_facts
  expected_args: [query]

# Self-introspection (harness-dbu). The router should pick the
# introspect tool with the matching scope when the user asks about
# the agent's own capabilities. Scope is a required arg so a right-
# tool / wrong-args mismatch is still caught by partial-credit scoring.
- prompt: what can you do
  expected_tool: introspect
  expected_args: [scope]

- prompt: what tools do you have
  expected_tool: introspect
  expected_args: [scope]

- prompt: what's your context window
  expected_tool: introspect
  expected_args: [scope]

- prompt: how much do you remember about me
  expected_tool: introspect
  expected_args: [scope]

- prompt: what CLI commands are there
  expected_tool: introspect
  expected_args: [scope]

# Null cases — casual chat, greetings, things the main model can
# answer without a tool. The 1.5B has a bias toward over-routing, so
# these are load-bearing for catching regressions.
- prompt: hey how's it going
  expected_tool: null

- prompt: good morning
  expected_tool: null

- prompt: tell me a joke
  expected_tool: null

- prompt: what's 2 plus 2
  expected_tool: null

- prompt: thanks, that was helpful
  expected_tool: null

- prompt: what do you think about that approach
  expected_tool: null

- prompt: write a haiku about autumn
  expected_tool: null

- prompt: explain what a merkle tree is
  expected_tool: null

# Creative-writing requests that reference our prior chat. Hermes-3
# latches on phrases like "from our conversation" / "based on what we
# discussed" and mis-routes these to introspect(scope=all). They're
# generation tasks, not self-reflection — the main model answers from
# its own working context, no tool needed (harness-798).
- prompt: make up a science fiction story in 500 words derived entirely from our conversation
  expected_tool: null

- prompt: write a short story based on what we discussed today
  expected_tool: null

- prompt: compose a poem using the themes from our chat
  expected_tool: null

- prompt: turn our conversation into a parable
  expected_tool: null

- prompt: summarize our conversation as a limerick
  expected_tool: null
