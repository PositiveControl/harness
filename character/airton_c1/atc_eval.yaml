version: 1
purpose: |
  Domain eval for airton_c1 (JO 7110.65-only specialist). Replays
  controller-side Q&A through the full stack (episodic retrieval →
  persona adapter → reply). Scores citation presence (each
  expected_citations entry's alternate list must have ≥1 alternate
  present in the reply) and keyword recall (≥ min_keyword_hits entries
  must have ≥1 alternate present).

  Phase-1 target: ≥80% pass (10/12).

  Start set keys on sections verified present in the ingested JO
  7110.65BB corpus (Basic w/ Chg 1 & 2, 2026-01-22) after harness-iyxs.
  Each case's expected_citations was spot-checked against the seed
  store via sqlite queries; each case's keywords come from the actual
  section text, not invented content.

  Conventions match character/airton_c/atc_eval.yaml:
    id:                 '<audience>_<topic_slug>' — stable across runs.
    audience:           'controller' for this fixture.
    expected_citations: scalar string OR list of alternates (any present
                        in reply counts). Plain section form: '5-5-4',
                        '2-4-3'. Reply-side paraphrase robust.
    expected_keywords:  scalar string OR list of alternates per entry.
                        Keep alternates specific enough that an
                        off-topic reply still fails.
    min_keyword_hits:   how many entries must match. Default 2.

cases:
  # ----- Chapter 2 — General Control -----

  - id: controller_readback_requirement
    audience: controller
    question: "What do I need to verify when a pilot reads back an ATC clearance, per JO 7110.65?"
    expected_citations: ["2-4-3"]
    expected_keywords:
      - ["read back", "readback", "acknowledge"]
      - ["hold short", "hold-short"]
      - ["call sign", "callsign"]
    min_keyword_hits: 2

  - id: controller_wake_turbulence_application
    audience: controller
    question: "When do wake turbulence procedures apply under JO 7110.65?"
    expected_citations: ["2-1-19"]
    expected_keywords:
      - "wake turbulence"
      - "behind"
      - ["separation", "separation is required"]
    min_keyword_hits: 2

  # ----- Chapter 3 — Terminal -----

  - id: controller_same_runway_departure
    audience: controller
    question: "When can I clear a departing aircraft for takeoff behind another departing aircraft on the same runway?"
    expected_citations: ["3-9-6"]
    expected_keywords:
      - ["crossed the runway end", "runway end", "departure end"]
      - ["takeoff roll", "departed", "takeoff"]
      - ["turned", "avert", "conflict"]
    min_keyword_hits: 2

  - id: controller_same_runway_arrival
    audience: controller
    question: "When may an arriving aircraft cross the landing threshold behind another aircraft on the same runway?"
    expected_citations: ["3-10-3"]
    expected_keywords:
      - "landed"
      - ["clear of the runway", "clear of runway", "off the runway"]
      - ["landing threshold", "threshold"]
    min_keyword_hits: 2

  # Regression fixture (epic harness-rhto, session 2026-04-24):
  # lay-term phrasing of same-runway-arrival minima. Baseline retrieval
  # missed §3-10-3 chunk 759 (dense ~0.016 below 0.5 floor; BM25 drowned
  # by frequent tokens). Expected answer: Cat I behind Cat I/II = 3,000 ft;
  # Cat II behind Cat I/II = 4,500 ft; Cat III involved = 6,000 ft.
  - id: controller_same_runway_arrival_lay_phrasing
    audience: controller
    question: "What is the shortest distance an aircraft is allowed to be next to another aircraft on approach to the runway?"
    expected_citations: ["3-10-3"]
    expected_keywords:
      - ["3,000 feet", "3000 feet"]
      - ["4,500 feet", "4500 feet"]
      - ["Category I", "Cat I", "category i"]
    min_keyword_hits: 2

  # ----- Chapter 4 — IFR -----

  - id: controller_ifr_clearance_items_order
    audience: controller
    question: "In what order do I issue IFR clearance items?"
    expected_citations: ["4-2-1"]
    expected_keywords:
      - ["aircraft identification", "aircraft ID", "callsign"]
      - "clearance limit"
      - ["route", "route of flight"]
    min_keyword_hits: 2

  - id: controller_vertical_separation_rvsm
    audience: controller
    question: "What's the IFR vertical separation minimum up to FL 410, and what changes above it?"
    expected_citations: ["4-5-1"]
    expected_keywords:
      - ["1,000 feet", "1000 feet", "1,000 ft"]
      - ["FL 410", "FL410", "flight level 410"]
      - ["2,000 feet", "2000 feet", "non-RVSM", "non−RVSM"]
    min_keyword_hits: 2

  # ----- Chapter 5 — Radar -----

  - id: controller_radar_standard_separation
    audience: controller
    question: "What's the standard radar separation minimum in terminal airspace when using single-sensor ASR?"
    expected_citations: ["5-5-4"]
    expected_keywords:
      - ["3 miles", "3 NM", "three miles"]
      - ["40 miles", "40 NM"]
      - ["5 miles", "5 NM", "five miles"]
    min_keyword_hits: 2

  - id: controller_handoff_responsibilities
    audience: controller
    question: "What must the transferring controller do before making a flight-path change during a radar handoff?"
    expected_citations: ["5-4-5"]
    expected_keywords:
      - "receiving controller"
      - ["verbally", "verbal", "coordinate", "coordination"]
      - ["approval", "approve", "obtain"]
    min_keyword_hits: 2

  - id: controller_missed_approach_precoord
    audience: controller
    question: "When must I issue a specific missed approach procedure before the aircraft starts final descent?"
    expected_citations: ["5-10-11"]
    expected_keywords:
      - "final approach"
      - ["IFR conditions", "IMC", "instrument conditions"]
      - "missed approach"
    min_keyword_hits: 2

  # ----- Chapter 7 — Visual -----

  - id: controller_class_b_vfr_clearance
    audience: controller
    question: "What's the phraseology for clearing a VFR aircraft into Class B airspace?"
    expected_citations: ["7-9-2"]
    expected_keywords:
      - "CLEARED"
      - ["BRAVO", "Class B", "Bravo airspace"]
      - ["ATC clearance", "clearance"]
    min_keyword_hits: 2

  - id: controller_vfr_on_top
    audience: controller
    question: "Under what condition may I clear an IFR aircraft to maintain 'VFR-on-top'?"
    expected_citations: ["7-3-1"]
    expected_keywords:
      - ["IFR flight plan", "IFR"]
      - ["pilot requests", "pilot of an aircraft", "request"]
      - ["VFR-on-top", "VFR on top"]
    min_keyword_hits: 2

  # ----- Chapter 10 — Emergencies -----

  - id: controller_emergency_distress_urgency
    audience: controller
    question: "What's the difference between a Distress and an Urgency emergency, and how does a pilot declare each?"
    expected_citations: ["10-1-1"]
    expected_keywords:
      - "Mayday"
      - ["Pan-Pan", "Pan Pan"]
      - "distress"
      - "urgency"
    min_keyword_hits: 3

  # ----- Regression cases from session 2026-04-24 (harness-5zh) -----
  #
  # These were anecdotal retrieval + grounding failures observed during
  # the chunker-fold (harness-1s4) + FTS5-stemming (harness-cpf) +
  # forced-grounding (harness-3uh) work. Seeded here so future
  # retrieval changes can't silently regress them — the first
  # retrieval-only run (harness-dfa) showed the original 13 cases all
  # saturating at rank 0, so the eval had no discriminating power
  # without these.

  # Post-chunker the §10-2-5 body now carries the full "declared by:
  # pilot / facility personnel / officials / system-generated" list.
  # Pre-chunker-fix it was truncated to the opening line and the model
  # fell back on §10-1-1 (related but wrong section). Post-cpf porter
  # stemming, hybrid retrieval ranks §10-2-5 at position 2 for this
  # query despite the 'declare' vs 'declared' tense mismatch.
  - id: controller_emergency_declaration_authority
    audience: controller
    question: "Who may declare an emergency for an aircraft?"
    expected_citations: ["10-2-5"]
    expected_keywords:
      - "pilot"
      - ["facility personnel", "facility"]
      - ["officials", "official"]
      - ["system-generated", "system generated", "transmission from an aircraft"]
    min_keyword_hits: 3

  # Post-chunker-fix §4-6-4 body now includes the NOTE "The holding fix
  # may be omitted if included at the beginning of the transmission as
  # the clearance limit" — previously dropped at the `## _**NOTE−**_`
  # heading boundary. Verifies the NOTE content survives the fold AND
  # that retrieval surfaces §4-6-4 for the lay "leave out" paraphrase.
  - id: controller_omit_holding_instructions
    audience: controller
    question: "When may a controller leave out part of the holding instructions to an aircraft?"
    expected_citations: ["4-6-4"]
    expected_keywords:
      - ["omit", "may be omitted", "omitted"]
      - ["clearance limit", "clearance"]
      - ["holding fix", "fix"]
    min_keyword_hits: 2

  # Lay-paraphrase for wake turbulence application. Probes the
  # jargon-mismatch gap that motivates harness-ajn (query-side synonym
  # expansion): the user's question has zero overlap with the section's
  # title tokens and only one overlap with the body ('behind').
  - id: controller_wake_turbulence_concern_lay
    audience: controller
    # Both §2-1-19 (Wake Turbulence — application rule) and §2-1-20
    # (Wake Turbulence Cautionary Advisories — when to issue advisories)
    # are legitimate answers to the lay phrasing "worry about a small
    # plane behind a big jet": §2-1-19 is the general rule, §2-1-20
    # is the cautionary-advisory trigger that implements 'worry'. Every
    # tier-1 embedder candidate (sweep 2026-04-25) converges on §2-1-20
    # because it's semantically closer to the lay query, while keeping
    # §2-1-19 in or near top-10. Broadening to either-acceptable matches
    # the realistic answer space without forcing a brittle synonym
    # dependency on §2-1-19. The mirror jargon case
    # (controller_wake_turbulence_application) still pins §2-1-19
    # exactly so we don't lose precision on the canonical query.
    question: "When does a controller need to worry about a small plane flying behind a big jet?"
    expected_citations:
      - ["2-1-19", "2-1-20"]
    expected_keywords:
      - "wake turbulence"
      - "behind"
      - ["apply", "procedure", "separation", "advisory", "advisories"]
    min_keyword_hits: 2

  # Second lay-paraphrase for same-runway arrival minima. The existing
  # controller_same_runway_arrival_lay_phrasing keys on "shortest
  # distance on approach" (distance-language). This version uses
  # time-language ("how soon") to probe whether the stack handles the
  # distance-vs-time paraphrase, a different failure mode.
  - id: controller_same_runway_arrival_lay_time
    audience: controller
    question: "How soon after a plane lands can the next one cross the runway threshold?"
    expected_citations: ["3-10-3"]
    expected_keywords:
      - ["landed", "has landed"]
      - ["clear of the runway", "clear of runway", "off the runway"]
      - ["threshold", "landing threshold"]
    min_keyword_hits: 2

  # Retrieval regression — session 2026-04-24. User asked
  # 'Where can a controller find information for aircraft-to-aircraft
  # alerts?' expecting §13-1-2(a), got §2-1-6 SAFETY ALERT and various
  # unrelated hits. Root cause (sanitize_fts_query in
  # src/harness/store/_hybrid.py): the hyphenated compound
  # 'aircraft-to-aircraft' was shredded into three OR'd single-token
  # clauses, so the distinctive n-gram lost all adjacency signal and
  # §13-1-2 dropped out of top-12. Post-fix, the sanitizer also emits
  # a quoted phrase clause ('aircraft to aircraft') which text-mode
  # BM25 rewards, lifting §13-1-2 into top-10. Keywords key on
  # §13-1-2(a)'s 'EDST' + 'conflict probe' + 'aircraft-to-aircraft'
  # so any future regression in sanitize_fts_query or the tokenizer
  # pipeline surfaces here.
  - id: controller_aircraft_to_aircraft_alerts
    audience: controller
    question: "Where can a controller find information for aircraft-to-aircraft alerts?"
    expected_citations: ["13-1-2"]
    expected_keywords:
      - ["EDST", "En Route Decision Support Tool"]
      - ["aircraft-to-aircraft", "aircraft to aircraft"]
      - ["conflict probe", "conflict alert", "conflict detection"]
    min_keyword_hits: 2

  # Regression — session 2026-04-24. airton_c1 correctly cited §4-1-1
  # but hallucinated the MH row of TBL 4-1-2 (wrote "50 miles" — the
  # value from the H row — instead of the true "25 miles"). Retrieval
  # was NOT the bug: §4-1-1 chunk_0 ranked #0 (0.033). Root cause:
  # SearchMemoryTool truncates hit.body to 400 chars, and chunk_0's
  # prologue + REFERENCE block consumes that budget before TBL 4-1-2's
  # CL/MH rows appear; chunk_1 begins at the H/HH tail so no chunk
  # surfaces the MH row to the model. Keyword-side pins the correct
  # value ("25"/"25 miles") so a fabrication that re-lands on 50 fails,
  # and the citation pin prevents off-section drift. This is the kind
  # of numeric-table hallucination the quote-or-abstain catcher would
  # intercept — see bd harness-5uq.
  - id: controller_rbn_mh_usable_distance
    audience: controller
    question: "What is the usable distance for an MH class RBN?"
    expected_citations: ["4-1-1"]
    expected_keywords:
      - ["25 miles", "25 NM", "25 nautical"]
      - ["MH", "MH class"]
      - ["radio beacon", "RBN", "L/MF"]
    min_keyword_hits: 2

  # ----- Fixture growth 19 -> 29 (plan #4, 2026-04-25) -----
  # Adds coverage for previously-uncovered chapter-2 / chapter-10
  # sections, more lay-paraphrase pairs (paired with existing jargon
  # cases on the same anchor), and one multi-anchor speed-adjustment
  # case that genuinely splits across sibling sections.

  # ----- Group A: core-chapter gaps -----

  - id: controller_safety_alert_terrain
    audience: controller
    question: "When must a controller issue a safety alert to an aircraft?"
    expected_citations: ["2-1-6"]
    expected_keywords:
      - "safety alert"
      - ["terrain", "obstruction", "aircraft"]
      - ["unsafe proximity", "deemed", "appears"]
    min_keyword_hits: 2

  - id: controller_minimum_fuel
    audience: controller
    question: "What does a 'minimum fuel' advisory from a pilot mean for a controller?"
    expected_citations: ["2-1-8"]
    expected_keywords:
      - "minimum fuel"
      - ["delay", "undue delay", "unable"]
      - ["advise", "inform"]
    min_keyword_hits: 2

  - id: controller_traffic_advisories
    audience: controller
    question: "When should a controller issue a traffic advisory to an aircraft?"
    expected_citations: ["2-1-21"]
    expected_keywords:
      - "traffic"
      - ["advisory", "advise", "issue"]
      - ["workload", "permits", "judgment"]
    min_keyword_hits: 2

  # Single-anchor: §10-4-4 is the only "communications failure"
  # section. §10-4-1/2/3 cover unrelated control actions (traffic
  # restrictions, lighting, traffic resumption).
  - id: controller_radio_comm_failure
    audience: controller
    question: "An IFR aircraft has lost two-way radio communication — what's the controller's first action?"
    expected_citations: ["10-4-4"]
    expected_keywords:
      - ["communication", "comm", "radio"]
      - ["failure", "lost", "NORDO"]
      - ["attempt", "alternative frequency", "relay"]
    min_keyword_hits: 2

  # ----- Group B: lay-paraphrase pairs -----
  # Each B case is paired with an existing jargon case on the same
  # anchor — recall@k of the jargon and lay variants together is the
  # register-gap durability signal.

  # Paired with controller_readback_requirement (§2-4-3, jargon).
  - id: controller_readback_lay_doublecheck
    audience: controller
    question: "How do I make sure a pilot heard the clearance correctly?"
    expected_citations: ["2-4-3"]
    expected_keywords:
      - ["readback", "read back"]
      - ["verify", "ensure", "correctness"]
      - ["clearance", "instruction"]
    min_keyword_hits: 2

  # Paired with controller_vertical_separation_rvsm (§4-5-1, jargon).
  - id: controller_vertical_minima_lay
    audience: controller
    question: "How close vertically can I let two planes get up at the airliner cruise altitudes?"
    expected_citations: ["4-5-1"]
    expected_keywords:
      - ["1,000", "thousand"]
      - ["FL 290", "FL 410", "RVSM"]
      - ["vertical", "separation"]
    min_keyword_hits: 2

  # Paired with controller_missed_approach_precoord (§5-10-11, jargon).
  - id: controller_missed_approach_lay
    audience: controller
    question: "If a plane has to go around at the last second, when am I supposed to have already told them what to do next?"
    expected_citations: ["5-10-11"]
    expected_keywords:
      - ["missed approach", "go around"]
      - ["before", "prior", "advance"]
      - ["instructions", "procedure"]
    min_keyword_hits: 2

  # Paired with controller_handoff_responsibilities (§5-4-5, jargon).
  - id: controller_handoff_lay
    audience: controller
    question: "What do I need to do before changing a plane's altitude during a handoff to the next sector?"
    expected_citations: ["5-4-5"]
    expected_keywords:
      - "handoff"
      - ["coordinate", "coordination", "approval"]
      - ["transferring", "receiving", "transferring controller"]
    min_keyword_hits: 2

  # ----- Group C: multi-anchor ambiguity -----
  # Probes the alternate-list fixture shape introduced for
  # wake_turbulence_concern_lay (§2-1-19 / §2-1-20). Single-anchor
  # was the right call for hijack (§10-2-6 only — §10-2-7 is VFR
  # weather difficulty, unrelated) and lost comms (§10-4-4 only).
  # Speed adjustment IS genuinely split across §5-7-1 + §5-7-2.

  - id: controller_hijack_squawk
    audience: controller
    question: "An aircraft just squawked 7500. What does the controller do?"
    expected_citations: ["10-2-6"]
    expected_keywords:
      - "7500"
      - ["hijack", "unlawful interference"]
      - ["acknowledge", "covertly", "secure"]
    min_keyword_hits: 2

  # §5-7-1 (Application — when to adjust speed) and §5-7-2 (Methods —
  # how to phrase the adjustment) both legitimately answer the
  # phraseology question depending on the controller's framing.
  - id: controller_speed_adjustment_phraseology
    audience: controller
    question: "What's the phraseology for telling a pilot to slow down?"
    expected_citations:
      - ["5-7-1", "5-7-2"]
    expected_keywords:
      - ["reduce speed", "slow"]
      - ["knots", "indicated airspeed", "Mach"]
      - "maintain"
    min_keyword_hits: 2
