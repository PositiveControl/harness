version: 1

# Query-side-only lay-term synonyms (harness-ajn).
#
# Same YAML shape as synonyms.yaml but consumed ONLY by the query-side
# expander (src/harness/retrieval/query_expander.py::load_query_expander),
# NOT by the ingest script. Use this file for entries that should trigger
# expansion on incoming user queries but would hurt retrieval precision
# if baked into the stored row text at ingest time.
#
# Why split:
#   synonyms.yaml lives on BOTH sides — ingest-time row augmentation
#   (principle gets "[synonyms: ...]" appended) + query-time expansion.
#   Ingest-side augmentation helps BM25 hit lay queries on the stored
#   rows, but it dilutes precision for jargon queries: every extra
#   synonym token in the stored principle lowers TF/IDF weight on
#   the section's jargon identity. Concrete regression (harness-ajn
#   measurement): adding "small plane behind big jet" to §2-1-19's
#   ingest-side synonyms moved the jargon query "when do wake
#   turbulence procedures apply" from rank 0 to rank 9, even though
#   the lay query "small plane flying behind a big jet" moved from
#   hard miss to rank 0. Net-neutral on aggregate recall but bad on
#   precision.
#
# The split preserves ingest-side precision while still giving
# query-side expansion a place to drop entries that target paraphrase
# patterns the ingest side shouldn't adopt. Adding new lay-query
# coverage post this split: put the entry here first, measure, promote
# to synonyms.yaml only if ingest-side augmentation also helps.

sections:
  "3-10-3":
    # Time-language paraphrases for same-runway arrival minima. These
    # capture the temporal phrasing users reach for ("how soon after
    # plane lands") rather than the spatial phrasing ("shortest
    # distance on approach" — already in synonyms.yaml). Content tokens
    # stay arrival-specific so they don't bleed onto §3-9-6 (departure)
    # or §3-12-3 (sea lane).
    - soon after plane lands cross threshold
    - time before next aircraft lands
    - next aircraft cross runway threshold

  "2-1-19":
    # Wake turbulence application. Controllers apply wake procedures
    # when one aircraft flies behind another in a way that matters —
    # the lay phrasing is about size asymmetry ("small plane behind
    # big jet"), not the jargon "wake turbulence." Entries target that
    # asymmetry wording.
    - small plane behind big jet
    - small aircraft behind large aircraft
    - flying behind large aircraft
    - smaller plane trailing larger plane
    - controller worry wake behind jet

  "5-10-11":
    # Missed approach procedure issuance — case
    # `controller_missed_approach_lay`. Lay phrasing uses "go around"
    # (vs jargon "missed approach") and the temporal "last second" /
    # "before final descent" framing. The doc-text uses
    # "Before an aircraft starts final descent" which has zero token
    # overlap with the lay phrasing. Entries bridge "go around" ↔
    # "missed approach" + the timing semantics. Rank: hard-miss → 0
    # (added 2026-04-25, query-only sufficient per policy).
    # Jargon case `controller_missed_approach_precoord` (§5-10-11
    # paired) confirmed unchanged at rank 0 post-add.
    - go around at last second
    - missed approach already told pilot
    - tell pilot missed approach before descent
    - issue missed approach before final descent
    - missed approach instructions advance

  "5-4-5":
    # Transferring controller handoff — case `controller_handoff_lay`.
    # Lay phrasing collapses "transferring controller" to "next sector"
    # and "flight path / altitude / speed change" to "changing the
    # plane's altitude." Doc-text says "Verbally obtain the receiving
    # controller's approval prior to making any changes to an
    # aircraft's flight path, altitude..." — direct overlap on
    # "altitude" but lay omits "receiving" / "transferring." Entries
    # bridge the role-naming gap. Rank: hard-miss → 0 (added
    # 2026-04-25, query-only sufficient per policy). Jargon case
    # `controller_handoff_responsibilities` (§5-4-5 paired) confirmed
    # unchanged at rank 0 post-add.
    - changing altitude during handoff
    - approval before changing altitude handoff
    - next sector approval before altitude change
    - altitude change while handoff in progress
    - coordinate altitude change handoff next controller

  "2-4-3":
    # Pilot acknowledgment / readback — case
    # `controller_readback_lay_doublecheck`. Lay phrasing "make sure
    # a pilot heard the clearance correctly" doesn't carry the jargon
    # "readback" or "acknowledge"; the section title is
    # PILOT ACKNOWLEDGMENT/READ BACK. The flat-chunk retrieval
    # baseline (pre-harness-c9fc) surfaced this case via lay-language
    # tokens scattered across chunks; section-level tree embeddings
    # (the harness-h5ly default) don't capture the same signal
    # because the section's body uses jargon. Entries bridge "heard
    # correctly" / "got the clearance right" → readback/acknowledge
    # so the lay query lands on §2-4-3. Rank: hard-miss → expected
    # ≤ 5 (added 2026-05-14, harness-c9fc).
    - make sure pilot heard the clearance correctly
    - confirm pilot heard the clearance
    - make sure pilot got the clearance right
    - verify pilot heard clearance correctly
    - check pilot got clearance correctly
