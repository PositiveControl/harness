# Router eval fixture for airton_c1 — pins small-model intent routing
# accuracy for the atc tool profile. Flat YAML list (matches the
# loader in src/harness/evals/router.py). Each entry:
#
#   prompt: the user message
#   expected_tool: tool name the router should pick, or `null` for
#     'no tool needed'. For atc, `null` is reserved for CASUAL CHAT
#     ("thanks", "ready to study") — rule questions, even bareword
#     yes/no ones, must go through search_memory. Pre-retrieval on
#     the JO 7110.65 corpus is not reliable enough to trust as the
#     sole grounding path (observed cosine 0.016 on "ground controller
#     takeoff clearance" vs. min_score=0.5 floor), so every rule-shaped
#     question gets an explicit chunk fetch. search-first > guess.
#   expected_args (optional): arg names that MUST appear.
#   expected_arg_values (optional): {arg: substring} — pins actual
#     values for 'right tool, leaked domain' guards.
#
# airton_c1's tool surface is the 'atc' profile — search_memory for
# every rule lookup (anchored or bareword), fetch_url (aviation
# allowlist) for live NOTAMs/weather, search_web for research,
# introspect for self-description.

# ----- section lookup → search_memory -----

- prompt: "what does JO 7110.65 §5-5-4 say"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "find every section that mentions Mode C"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "look up the wake turbulence separation minimums in the book"
  expected_tool: search_memory
  expected_args: [query]

# ----- live data → fetch_url (aviation allowlist) -----

- prompt: "check the current NOTAMs for KSFO"
  expected_tool: fetch_url
  expected_args: [url]

- prompt: "get me the latest METAR for KPHX"
  expected_tool: fetch_url
  expected_args: [url]

# ----- rule explanation → search_memory -----
# Anchored "under JO 7110.65" phrasing still goes through search_memory.
# The explicit fetch is cheap and keeps the answer grounded.

- prompt: "explain how handoffs work under JO 7110.65"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "what's the phraseology for clearing a VFR aircraft into Class B"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "walk me through standard radar separation"
  expected_tool: search_memory
  expected_args: [query]

# ----- bareword rule questions (no 'JO 7110.65' / 'book' / '§' anchor) → search_memory -----
# Observed hallucination where "Can a ground controller clear takeoff?"
# got routed to search_facts (empty store) and the model fabricated an
# affirmative answer. Pre-retrieval also missed (cosine 0.016 vs 0.5
# floor). Correct policy for atc: every rule-shaped question forces an
# explicit search_memory fetch — search-first beats guess-and-nudge.

- prompt: "can a ground controller clear an aircraft for takeoff"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "who issues the takeoff clearance"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "does ground handle the runway"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "is local control responsible for go-arounds"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "how much separation between a heavy and a small on departure"
  expected_tool: search_memory
  expected_args: [query]

# ----- explicit search intent without JO anchor → search_memory -----

- prompt: "look up what the rule is for land-and-hold-short"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "find the section on visual separation"
  expected_tool: search_memory
  expected_args: [query]

# ----- user-memory lookup → search_facts (positive case to distinguish) -----

- prompt: "what did I tell you about my exam timeline"
  expected_tool: search_facts
  expected_args: [query]

# ----- self-description → introspect -----

- prompt: "what tools do you have available"
  expected_tool: introspect

# ----- casual → null -----

- prompt: "hey, ready to study"
  expected_tool: null

- prompt: "thanks, that makes sense"
  expected_tool: null

# ----- banter / empty signal → null (epic harness-jjm9, child harness-q7ff) -----
# These prompts carry no rule-shape and no domain anchor — fabricating a
# JO 7110.65 chunk from thin retrieval is the failure mode (Run 12). The
# router's only job here is to NOT route to search_memory; the joke /
# redirect reply is composed by the tool-loop pre-model intercept
# (harness-vadq) using harness.persona.banter primitives.

- prompt: "this page intentionally left blank"
  expected_tool: null

- prompt: "this page is intentionally left blank."
  expected_tool: null

- prompt: "test"
  expected_tool: null

- prompt: "ping"
  expected_tool: null

- prompt: "are you there"
  expected_tool: null

- prompt: "are you alive"
  expected_tool: null

- prompt: "lorem ipsum dolor sit amet"
  expected_tool: null

- prompt: "aaaa"
  expected_tool: null

- prompt: "ok cool whatever"
  expected_tool: null

# ----- negative banter cases — short OR domain-flavored, must NOT
# route to null. Pin the boundary so a future router-prompt tweak that
# over-broadens 'null' immediately fails the eval.

- prompt: "§4-5-1"
  expected_tool: search_memory
  expected_args: [query]

- prompt: "wake turbulence minima for heavy followed by small"
  expected_tool: search_memory
  expected_args: [query]

# ----- remember a study fact → remember_fact -----

- prompt: "remember that I'm prepping for the CTO exam in six weeks"
  expected_tool: remember_fact
